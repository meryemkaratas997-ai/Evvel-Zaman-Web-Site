<!DOCTYPE html>
<html lang="tr">
<head>

<style>
:root{--bg-page:#f6f3ea;--bg-card:#fff;--text-main:#2b2725;--text-muted:#6b645c;--accent-primary:#943328;--accent-hover:#73261d;--border-color:#e5dfd3;--card-active-bg:#fdfaf3;--shadow:0 4px 16px rgba(43,39,37,.06);--font-body:Georgia,Palatino,"Times New Roman",serif;--font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
[data-theme="dark"]{--bg-page:#1a1b1e;--bg-card:#24262b;--text-main:#ece7de;--text-muted:#a19d95;--accent-primary:#d47064;--accent-hover:#e2877c;--border-color:#383a42;--card-active-bg:#2d3036;--shadow:0 4px 16px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg-page);color:var(--text-main);font-family:var(--font-body);min-height:100vh;transition:background .25s,color .25s}
header{background:var(--bg-card);border-bottom:1px solid var(--border-color);padding:20px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}.header-container{max-width:1280px;margin:auto;display:flex;flex-direction:column;gap:16px}.header-top,.header-filters{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.logo-area h1{font-size:1.65rem;color:var(--accent-primary)}.logo-area p{font: .88rem var(--font-ui);color:var(--text-muted);margin-top:3px}.controls-area{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,input,textarea,select{font:inherit}.btn-action,.btn-chip,.small-btn,.status-btn,.tab-btn{background:transparent;border:1px solid var(--border-color);color:var(--text-main);font-family:var(--font-ui);font-size:.85rem;font-weight:600;padding:7px 11px;border-radius:6px;cursor:pointer;transition:.2s}.btn-action:hover,.small-btn:hover,.status-btn:hover,.tab-btn:hover{border-color:var(--accent-primary);color:var(--accent-primary)}.search-box{flex:1;min-width:220px;max-width:380px}.search-box input{width:100%;padding:9px 14px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-page);color:var(--text-main)}.category-group{display:flex;flex-wrap:wrap;gap:6px}.btn-chip{font-size:.8rem;border-radius:20px;color:var(--text-muted)}.btn-chip.active,.tab-btn.active{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff}
main{max-width:1280px;margin:24px auto;padding:0 20px;width:100%;display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px}.catalog-area{min-width:0}.catalog-header{font:700 .8rem var(--font-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding-bottom:12px}.catalog-panel{display:flex;flex-direction:column;gap:12px}.tale-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:15px;cursor:pointer;transition:.2s;box-shadow:0 2px 6px #00000005;text-align:left;width:100%;color:var(--text-main)}.tale-card:hover{border-color:var(--accent-primary);transform:translateY(-2px);box-shadow:var(--shadow)}.tale-card.active{border-color:var(--accent-primary);background:var(--card-active-bg);border-left:4px solid var(--accent-primary)}.card-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.card-tag{font:700 .7rem var(--font-ui);text-transform:uppercase;color:var(--accent-primary)}.card-number{font:.75rem var(--font-ui);color:var(--text-muted)}.card-title{font-size:1.08rem;margin-bottom:6px;line-height:1.3}.card-desc{font:.85rem/1.45 var(--font-ui);color:var(--text-muted)}.card-status{margin-top:9px;color:var(--accent-primary);font:.78rem var(--font-ui);font-weight:700}.no-results{padding:24px;text-align:center;background:var(--bg-card);border:1px dashed var(--border-color);border-radius:8px;color:var(--text-muted);font-family:var(--font-ui)}
.reader-panel,.profile-panel{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:clamp(20px,4vw,48px);box-shadow:var(--shadow);min-width:0}.reader-header{border-bottom:1px solid var(--border-color);padding-bottom:22px;margin-bottom:28px}.reader-category{font:700 .82rem var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-primary);display:inline-block;margin-bottom:8px}.reader-title{font-size:clamp(1.7rem,3vw,2.2rem);line-height:1.25;margin-bottom:12px}.reader-meta-row{font:.85rem var(--font-ui);color:var(--text-muted);display:flex;gap:14px;flex-wrap:wrap}.reader-content{font-size:18px;line-height:1.85;color:var(--text-main);max-width:72ch;margin:0 auto;width:100%}.reader-content p{margin-bottom:1.5em;text-indent:1.5em;position:relative}.reader-content p:first-of-type::first-letter{font-size:3.2rem;float:left;line-height:.9;margin-right:10px;color:var(--accent-primary);font-weight:700}.reader-footer{margin-top:35px;padding-top:18px;border-top:1px dashed var(--border-color);font:.82rem var(--font-ui);color:var(--text-muted)}
.section-box{margin-top:26px;padding-top:22px;border-top:1px solid var(--border-color)}.section-title{font-size:1.25rem;margin-bottom:12px}.muted{color:var(--text-muted);font: .9rem/1.5 var(--font-ui)}.status-row,.rating-row,.form-actions,.profile-heading,.profile-stats,.tabs,.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status-row{margin-top:18px}.status-btn.active{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff}.status-note{font:.8rem var(--font-ui);color:var(--text-muted);margin-top:8px}.primary-btn{background:var(--accent-primary);border:1px solid var(--accent-primary);color:#fff;border-radius:6px;padding:9px 14px;font:600 .9rem var(--font-ui);cursor:pointer}.primary-btn:hover{background:var(--accent-hover)}.form-control{width:100%;background:var(--bg-page);color:var(--text-main);border:1px solid var(--border-color);border-radius:6px;padding:10px 12px;margin:7px 0 12px;font: .92rem var(--font-ui)}textarea.form-control{min-height:90px;resize:vertical}.quote-item,.review-item,.saved-item{padding:14px;margin:10px 0;background:var(--bg-page);border:1px solid var(--border-color);border-radius:8px}.quote-text{font-size:1.02rem;font-style:italic;line-height:1.6}.item-meta{font:.78rem var(--font-ui);color:var(--text-muted);margin-top:8px}.like-btn{border:0;background:transparent;color:var(--accent-primary);cursor:pointer;font:600 .88rem var(--font-ui);padding:5px 0}.stars{display:flex;gap:3px}.star-btn{border:0;background:none;color:#b8ad9d;font-size:1.7rem;cursor:pointer;padding:0 2px}.star-btn.selected{color:#d49a25}.profile-panel{grid-column:1/-1}.profile-heading{align-items:center;margin-bottom:18px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card-active-bg);border:1px solid var(--border-color);font-size:1.8rem}.profile-heading h2{font-size:1.7rem}.profile-stats{margin:18px 0}.stat{flex:1;min-width:120px;padding:15px;background:var(--bg-page);border:1px solid var(--border-color);border-radius:8px}.stat strong{display:block;font-size:1.6rem;color:var(--accent-primary)}.stat span{font:.82rem var(--font-ui);color:var(--text-muted)}.tabs{margin:18px 0}.tab-content{min-height:90px}.empty-state{padding:16px;color:var(--text-muted);font:.9rem var(--font-ui);background:var(--bg-page);border-radius:8px}.hidden{display:none!important}.selection-quote-btn{position:absolute;z-index:10;background:var(--accent-primary);color:#fff;border:0;border-radius:6px;padding:8px 12px;font:.82rem var(--font-ui);box-shadow:var(--shadow);cursor:pointer}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:var(--bg-card);color:var(--text-main);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}.modal h2{margin-bottom:14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;right:20px;background:var(--text-main);color:var(--bg-card);padding:12px 16px;border-radius:8px;z-index:200;font:.9rem var(--font-ui);box-shadow:var(--shadow)}.profile-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.profile-bar input{width:130px;padding:7px 9px;background:var(--bg-page);color:var(--text-main);border:1px solid var(--border-color);border-radius:6px}
@media(max-width:900px){main{grid-template-columns:1fr}.catalog-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.profile-panel{grid-column:auto}header{position:static}}@media(max-width:600px){.header-filters{align-items:stretch;flex-direction:column}.search-box{max-width:100%}.catalog-panel{grid-template-columns:1fr}.controls-area{width:100%}.reader-panel{padding:20px}.profile-stats{display:grid;grid-template-columns:1fr 1fr}.reader-content{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="header-container">
    <div class="header-top">
      <div class="logo-area"><h1>Evvel Zaman</h1><p> Türk Masalları Derlemesi</p></div>
      <div class="controls-area">
        <button type="button" class="btn-action" id="btn-decrease" title="Yazıyı Küçült">A-</button>
        <button type="button" class="btn-action" id="btn-increase" title="Yazıyı Büyüt">A+</button>
        <button type="button" class="btn-action" id="btn-theme"><span id="theme-label">Gece Modu</span></button>
        <button type="button" class="btn-action" id="btn-profile">👤 Profilim</button>
      </div>
    </div>
    <div class="header-filters">
      <div class="search-box"><input type="text" id="search-input" placeholder="Masal veya anahtar kelime ara..." aria-label="Masal ara"></div>
      <div class="category-group" id="category-filters">
        <button type="button" class="btn-chip active" data-category="Tümü">Tümü</button>
        <button type="button" class="btn-chip" data-category="Aşk ve Arayış">Aşk ve Arayış</button>
        <button type="button" class="btn-chip" data-category="Sadakat ve Sevgi">Sadakat ve Sevgi</button>
        <button type="button" class="btn-chip" data-category="Kıskançlık ve Sabır">Kıskançlık ve Sabır</button>
        <button type="button" class="btn-chip" data-category="Olağanüstü Varlıklar">Olağanüstü Varlıklar</button>
      </div>
    </div>
  </div>
</header>
<main id="main-layout">
  <section class="catalog-area">
    <div class="catalog-header" id="count-info">8 Masal Listeleniyor</div>
    <div class="catalog-panel" id="tales-list"></div>
  </section>
  <article class="reader-panel" id="reader-view">
    <div class="reader-header">
      <span class="reader-category" id="view-category">Kategori</span>
      <h2 class="reader-title" id="view-title">Masal Başlığı</h2>
      <div class="reader-meta-row"><span id="view-time"></span><span id="view-theme-motif"></span></div>
      <div class="status-row" id="reader-status-controls" aria-label="Okuma durumu"></div>
      <div class="status-note" id="reader-status-note"></div>
    </div>
    <div class="reader-content" id="view-text"></div>
    <footer class="reader-footer"><strong>Kaynak:</strong> <span id="view-source"></span></footer>
    <section class="section-box" id="quotes-section">
      <h3 class="section-title">Bu Masaldan Alıntılar</h3><div id="tale-quotes"></div>
    </section>
    <section class="section-box" id="reviews-section">
      <h3 class="section-title">Masal İncelemeleri</h3>
      <div class="rating-row"><div class="stars" id="rating-stars" aria-label="Puan ver"></div><span id="rating-average" class="muted">Henüz puan verilmedi</span></div>
      <form id="review-form">
        <label for="review-text" class="muted">Bu masal sana ne hissettirdi? Kültürel motifleri nasıl buldun?</label>
        <textarea id="review-text" class="form-control" maxlength="600" placeholder="Masal hakkındaki düşüncelerini yaz..." required></textarea>
        <button class="primary-btn" type="submit">İncelemeyi Kaydet</button>
      </form>
      <div id="tale-reviews"></div>
    </section>
  </article>
  <section class="profile-panel hidden" id="profile-panel">
    <div class="profile-heading">
      <div class="avatar" id="profile-avatar-display">🧚</div>
      <div><h2>Masalcı Profilim</h2><p class="muted">Okuma yolculuğun ve kişisel paylaşımların</p></div>
      <button type="button" class="small-btn" id="btn-back-reader">Masallara dön</button>
    </div>
    <div class="profile-bar">
      <label class="muted" for="username-input">Kullanıcı adı</label><input id="username-input" maxlength="24" placeholder="Masalcı adı">
      <label class="muted" for="avatar-select">Avatar</label>
      <select id="avatar-select" class="form-control" style="width:auto;margin:0">
        <option value="🧚">🧚 Peri Kızı</option><option value="🤴">🤴 Şehzade</option><option value="🦹">🦹 Kırk Haramiler</option><option value="👑">👑 Padişah</option><option value="🕊️">🕊️ Turna</option><option value="🌹">🌹 Gül</option>
      </select>
      <button class="primary-btn" id="save-profile" type="button">Profili Kaydet</button>
    </div>
    <div class="profile-stats">
      <div class="stat"><strong id="stat-read">0/8</strong><span>Okunan masal</span></div>
      <div class="stat"><strong id="stat-rate">%0</strong><span>Okuma oranı</span></div>
      <div class="stat"><strong id="stat-quotes">0</strong><span>Paylaşılan alıntı</span></div>
      <div class="stat"><strong id="stat-reviews">0</strong><span>Yazılan inceleme</span></div>
    </div>
    <div class="tabs" id="profile-tabs">
      <button class="tab-btn active" data-tab="reading">Okuma Listem</button>
      <button class="tab-btn" data-tab="quotes">Alıntılarım</button>
      <button class="tab-btn" data-tab="reviews">İncelemelerim</button>
    </div>
    <div class="tab-content" id="profile-tab-content"></div>
  </section>
</main>
<div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script>
const TALES = [
  {
    "id": 1,
    "title": "Tuz Kadar Sevmek",
    "category": "Sadakat ve Sevgi",
    "readingTime": "12 dk",
    "motif": "Karpuz sınavı, tuz kadar sevmek, sabır ve Tembel Ahmet'in talihinin açılması",
    "summary": "Padişahın kendisini 'tuz kadar' sevdiğini söyleyen küçük kızını Tembel Ahmet'e vermesi ve sabır, azim ve sadakatle zenginleşip babasına hakikati göstermesini anlatan masal.",
    "source": "Sakaoğlu, Saim; Gümüşhane Bayburt Masalları. Ankara: Akçağ Yayınevi, 2002.",
    "paragraphs": [
      "Vakti zamanında, günlerin birinde bir padişah varmış. Bu padişahın da üç tane kızı varmış. Bu kızlar yetişip kemale gelmişler, babalarının aklına bunları ere vermek gelmemiş. Bu üç kardeş müşavere ederler:",
      "“Babamız bizi ere vermeyecek, ne yapalım da bunu babamıza anlatalım, bizi ere versin?”",
      "Küçükleri der ki:",
      "“Haydi, bağa gidelim, herkes şahsına göre bir karpuz alsın. Babamıza hediye gönderelim. Vezirleriyle beraber yesinler. Bundan bir hisse alabilirlerse alırlar, alamazlarsa ne yapalım. Çekecek olduğumuz çile bu.”",
      "“Haydi bakalım.” Deyip kalkarlar. Elini eline, eteğini beline sekerek, dökerek, ökçeleri büzüklerine değerek bağa giderler. Üç tane karpuz alırlar. Büyük kız öyle bir karpuz alır ki içi hiç yenecek halde değil, ortanca kızın karpuzundan da birer dilim ancak alınır. Küçük kız ise öyle bir karpuz alır ki tam kıvamına gelmiş, yenecek bir zamanda. Eve gelince büyük kız karpuzunu altın tabağın üstüne koyar, yanına da altın çatal ve bıçakları hazırlar, padişaha gönderir. Padişah:",
      "“Getirin bakalım, bu nedir?”",
      "“Büyük kızınız hediye gönderdi.”",
      "Aldılar karpuzu meydana, bıçağı vurdular ki hiç yenecek hali yok.",
      "“Kaldırın atın bu karpuzu.”",
      "Bu karpuzu kaldırıp kapıya attılar. Ortanca kız da aynı şekilde karpuzunu gönderdi. Onu da attırdı kapıya. Sonunda küçük kızın karpuzunu kestiler ki tam yenecek karpuz. Başladılar yemeye. Padişah:",
      "“Oh, gördün mü yenecek karpuzu, mal bu.”",
      "Vezir hemen padişahın kolunu kaptı: “Dur padişahım, hele karpuzu yeme.”",
      "“Ne olacak?”",
      "“Ne anladın sen bu karpuzlardan?”",
      "“Ne olacak çocuklar, birer karpuz göndermişler. Biz de yedik.”",
      "“Yok. O değil.”",
      "“Ya?”",
      "“Bak, büyük kızının ere gidecek zamanı geçti; ortancası da aha işte geçti geçecek, bir gecelik hali var; küçük kızının da tam ere gidecek zamanı.”",
      "“Çağırın büyük kızımı, gelsin.” Büyük kızını çağırırlar, gelir:",
      "“Kızım sen beni ne kadar seversin?”",
      "“Baba, bu dünyada en lezzetli nimetlerden iyi severim seni.”",
      "“Seni verdim filan vezirin oğluna.”",
      "O çıktıktan sonra ortanca kızını çağırır. Ona da aynı soruyu sorar. Ondan da benzer bir cevap alınca onu da başka bir vezirin oğluna verir.",
      "“Küçük kızımı çağırın gelsin.”",
      "Küçük kızı gelir, aynı soruyu ona da sorar, o da cevabı verir:",
      "“Baba, seni tuz kadar severim.”",
      "“Ya… Ben düştü düştüm de tuz oldum öyle mi? Bunu götürün, Tembel Ahmet’in evine atın!”",
      "Tembel Ahmet de anasından doğdu, tek day durup da bir adım atacak zamanında yürüdüğünü gördüler. Mütebakisi yatıyor. Yirmi yirmi beş yaşlarına geldi; anası dilenir, deşirir, onu yedirir, içerir. Kendi eliyle de yemez, anası yedirir.",
      "Kızı götürüp Tembel Ahmet’in evine atılar. Padişah kızı bu, su getirip verecek, ekmek pişirip yedirecek; kaynanası da dışardan dilenip deşirip getirecek.",
      "Haberi kimden verelim, padişahın kızından. Padişahın kızı parmağındaki yüzüğü çıkartıp neneye verir:",
      "“Nene, bu yüzüğü al, falan kuyumcuya götür. Ne verirse al. O parayla şu mendilin dolusu idare getir, üç baş da çubuk al. Artanını da geri getir.”",
      "Nene gider, o yüzüğü verip parayı alır. Mendili doldurur yem yiyecek; üç bağ da çubuk alır, vurur koltuğuna gelir. Padişahın kızı su kaynatır, çubukları tekneye koyar. Kazanın kaynayan suyunu çubukların üzerine döker, yemeğini pişirir Tembel’in. Bunu yedirir içirir. O gece yatarlar.",
      "Hayırlı sabahlar cümlemizin üzerine açılsın, sabah olur. Sabahleyin nene yine deşirmeye gider. Ahmet akşamdan hararetli yedi ya, susar:",
      "“Padişah kızı, bacı bir su ver, içeyim.”",
      "Kız gidip kâseyle su getirdi, koydu yanına. Ahmet kızı çağırdı:",
      "“Gel içir bu suyu.”",
      "“Gözün kör olsun, elin kırık değil ya, iç!”",
      "“Bacı, sen bilirsin, gel şu suyu içir bana.”",
      "Kız birini hatır için içirdi. İkinci defa isteyince yine getirdi:",
      "“Bacı, gel şu suyu içir.”",
      "“Kalk kendin iç!”",
      "“Kalkar vururum, döğerim seni.” diyene kadar padişahın kızı hemen yorganı Ahmet’in sırtından atıp çubuğu çekti. Tembel baktı ki padişahın kızı kendini öldürecek, kapıdan dışarı kendini koyuverdi. Çıktı ama, çıplak:",
      "“Bacı, çamaşırlarımı giyeyim de ondan sonra gideyim.”",
      "“Yok, şu mendili al, yanında bulunsun. Çamaşırlarını da vereyim, giyin. Bu mendili akşama kadar dolduramazsan gelme, kapıdan içeri giremezsin.”",
      "Çamaşırlarını verir buna. Tembel çamaşırlarını giyinir, mendili alır, gider. Bunu gören komşusu, köylüsü, delikanlısı ihtiyarı peşine düşer; sanki bir canavar geliyor. Bu doğru deniz iskelesine iner. Bakar ki bir vapur gelmiş, kaburgayı iskeleye verip yükünü boşaltıyor. Hamallar taşır, arabalar taşır. Buna hiç kimse demiyor ki: “Gel, bu yükü ötür de sana kırk para vereyim.” Durdu durdu, iş yok. İki tane dengin bir tarafa ayrıldığını görür. Bütün yükler taşınır, derken akşam olur. Paydos edecekler, daha bir şey kalmadı. O iki denk de orda, tüccar da orda. Tüccar seslenir adamlarına ki araba getirsinler de bunları götürsünler, Bu hemen tüccarın yanına yaklaşır:",
      "“Efendi, bunları ben götüreyim.”",
      "“Götürebilir misin oğlum, ağır bunlar. Gel bakalım?”",
      "Dengin birini omzuna aldı, birini koltuğuna aldı, sürdü doğru mağazanın kapısına. Ardiyenin kapısını açtılar, denkleri içeri atar.",
      "Tüccar bu denkleri ötekilerinin üstüne çıkarttıracak, oğlan bir şey der diye korkuyor:",
      "“Oğlum, bunları şu denklerin üzerine atamaz mısın?”",
      "“Hay hay, atayım.”",
      "Hemen bu iki dengi tutup öbürlerinin üzerine atar. Mağazaya çıkınca tüccar düşünmeye başlar. “Az versem de kızıp bana bir tokat vursa beni öldürür, çok versem de hesaba gelmez.” Neyse Tembele bir miktar verdi. Ahmet hemen oradan bakkala, fırına gider, mendili doldurur, birkaç kuruş da artırır, onu da mendilin ucuna düğümler, kapıya gelir:",
      "“Tak tak.”",
      "Padişahın kızı hemen seğirtir. Ahmet gelmeden evvel nene eve gelir ki ev silinmiş, süpürülmüş yemek pişmiş oğlu yok! Yatağı da kalkmış:",
      "“Kızım ne oldu oğlan?”",
      "“Nene, çubukları sana da çekmeyeyim, gel yerine otur. Sen oğlanı filan düşünme, gel yerine otur.”",
      "Nene yerine oturduktan bir müddet sonra kapı vurulur. Tembel içeri girer. Kız elinden mendili alıp masaya koyar. Hemen bir tuzlu su hazırlayıp Ahmet’in omuzlarını, kolların, bacaklarını bununla adamakıllı temizler, yıkar. Tembel’i oturttuktan sonra sofrayı kurar, yedirir, içirir, yatırır.",
      "Sabah olunca Tembel daha durur mu? Çalışmaya gider. Böylece her gün gidip üç beş kuruş alıp gelir. Padişahın kızı bir gün Ahmet’e der ki:",
      "“Ahmet, böyle olmaz. Sen bir eşek al, bir de balta al. Dağdan odun çek, odunculuk et. Hamallığı bırak artık.”",
      "Biriken paralarla Ahmet bir eşek alıp takımını düzer. Odun getirip satar; üç kuruş, beş kuruş, artık neye satıyorsa,",
      "Bir gün gider, odun getirir. Bu yük odunu dolandırdı, olmadı satamadı.",
      "Peşine bir hoca çıkar:",
      "“Ahmet oğlum, odunları satamadın mı?”",
      "“Hayır hoca, satamadım.”",
      "“Odunları bana verir misin?”",
      "“Hay hay hoca, vereyim.”",
      "“Eee.. Sür gelsin; ama ben para yerine bir söz veririm.”",
      "“Olsun hoca,”",
      "Ahmet, odunları hocanın kapısının önüne çekip yıkar; doğrayıp içeri atar:",
      "“Hoca, ver sözümü.”",
      "“Oğlum, ilmin başı sabır.”",
      "“Daha?”",
      "“Oğlum, ben sana “Bir söz söyleyeceğim.” Demiştim.”",
      "“Peki.”",
      "Ahmet padişahın kızının yanına gider: “Bacı, odunları satamadım, bir söze verdim.”",
      "“Ne sözü Ahmet?”",
      "“İlmin başı sabır.”",
      "“Kulağına koy. Ahmet bu söz bir gün sana lâzım olur. Bak, senin yevmiyen gitti bugün. Hem lâzım olacak bu söz.”",
      "“Peki.”",
      "Ahmet ertesi günkü odunu da satamaz, yine o hocaya rastlar:",
      "“Ahmet, odunları bana ver.”",
      "“Vereyim hocam,”",
      "“Ahmet, fiyatını biliyorsun, yine bir sözüm var.”",
      "“Olsun hocam,”",
      "Odunları götürüp hocanın kapısına yıkar, hocaya:",
      "“Hocam, der ver sözümü.”",
      "“Ahmet, “Sabrın başı selâmettir’ unutma.”",
      "“Peki hocam.”",
      "Ahmet sözünü alıp evine gelir, meseleyi padişahın kızına anlatır. O da:",
      "“Bu sözü sen kendi kafanda sakla, bana göre bir şey yok.”",
      "Ahmet ertesi günü odunları yine satamaz, hocaya rastlar:",
      "“Ahmet, odunları bana ver.”",
      "“Vereyim hocam.”",
      "Ahmet odunları hocanın kapısına çeker, hoca da sözünü verir: “Gönül kimi severse güzel odur.”",
      "Ahmet böylece oduna devam eder. Bir gün padişahın kızı Ahmet’e der ki:",
      "“Sen böyle odun taşımaynan gün geçiremezsin, bunun kışı da var. Kış gelince sen dışarıda odun yapamazsın. Git, bir batman un getir, sana azık edeyim. Dağda bir iki gün odun hazır et, bir mağaraya istif et. Kışın bir yol bulur onları yükler gelirsin.”",
      "“Peki bacı, olsun.”",
      "Ahmet bir batman un getirir. Padişahın kızı yuğurup ekmek pişirmeye oturur, Tembel de arkasında. Kız bir yandan ekmek pişirir, tandırdan çıkarır, Ahmet bir yandan yer. Biri pişirir, biri yer. Kız son ekmeği de tandırdan alıp geri döndü ki ekmek bir tane yok.",
      "“Ahmet, ne oldu buradaki ekmeklere?”",
      "“Bacı ekmekleri yedim.”",
      "“Ahmet, ocağın bata senin. Sen dağda ne yiyeceksin?”",
      "“Adam, bacı işim mi yok, sırtımda götürüp yük edeceğime karnımda götürürüm.”",
      "Ahmet kalkıp eşeğini semerler, baltasını alır, “Allahısmarladık”ı çekip ormanın yolunu tutar. Orada büyük bir mağara bulur, mağaranın yanındaki çamları köküyle, dalıyla içeri alır. Mağarayı odunla doldurur. Akşam olunca da eşeğini yükler, çarşıya gelip odunları satar. Akşam eve gelince padişahın kızı sorar:",
      "“Ne ettin Ahmet?”",
      "“Ne edeceğim bacı, odun yapıp bir mağaraya doldurdum.”",
      "“Peki Ahmet.”",
      "Ahmet odunculuğa devam eder. Güz gelince kar yağar. Dağa gidip odunları sakladığı mağarayı arayıp bulur. Bakar ki ne odun var, ne bir şey. Vermişler mağaraya ateşi. Mağaradaki bütün odun yanıp kül olmuş.",
      "“Ula… Ben ne edeyim şimdi, padişahın kızına ne yüzle gideceğim? Hele şu kömürlerden bir çuval doldurayım da götüreyim.”",
      "Oradaki kömürlerden toplayıp torbasına doldurur, dışardan da bir iki kucak odun yapıp eşeğin yanlarına vurur. Sürdü geldi eve. Kapıdan geçerken:",
      "“Bacı, mağarayı yakmışlar, bütün odunlar kömür olmuş. Biraz kömür getirdim.”",
      "Padişah kızı dikkatle baktı ki ne görsün, torbadakiler hep ‘lira’. “Ahmet, eşeği buraya yık, bu kömürlerden orada çok var mı?”",
      "“Bacı mağara bununla dolu.”",
      "“Ahmet, sen odunu filan bırak, terk et. Sen orada kül kömür bırakma, toz toprak ne varsa hepsini getir.”",
      "Ahmet tarladı topladı; mağaradaki külü kömürü olduğu gibi eve yıktı. Evde gün geçirirken bir gün kapıda bir tellâlın bağırdığını duyar:",
      "“Eyy, at binen, kılıç kuşanan kim var? Beş yüz lira aylığı var!”",
      "Ahmet hemen dışarıya fırlar:",
      "“Ne diyorsun tellâl?”",
      "“Eyyyy, at binen kılıç kuşanan…. Beş yüz lira aylık!”",
      "“Neredeymiş bu iş?”",
      "“Peşime gel.”",
      "Giderler, şehrin kenarına yedi tane bezirgân mallarını yıkmışlar, yanlarına bir hizmetkâr arıyorlar.",
      "“Oğlum, iyi at biner misin?”",
      "“Hay hay.” Hâlbuki at yüzü bile görmemiş!",
      "“Peki, bizimle gelir misin?”",
      "“Gelirim.”",
      "“Oğlum, sana beş yüz lira aylık vereceğim, bizimle gelir misin?”",
      "“Tabii gelirim.”",
      "“Git, bu gece evinde yat, çamaşırını al gel. Yarın şu saatte gel, gideceğiz.”",
      "Eve gelir; bacısına, anasına anlatır: “Ben beş yüz lira aylıkla gidiyorum.” Padişah kızı bir mendil çıkartıp buna verir:",
      "“Ahmet, bu mendil kırmızı lira ile dolup gelecek. O zaman sen benim, ben senin oluruz.”",
      "Ahmet mendili alıp gider, bezirgânların yanına varır. Buna bir kılıç verirler, atını gösterirler. Bezirgân hizmetkârlarına emir verir:",
      "“Bunun emrindesiniz, emir bundadır. ‘Yık!’ dediği yerde yıkarsınız, ‘Yükle!’ dediği yerde yüklersiniz. Bunun emrinden dışarı çıkmayacaksınız.”",
      "Yedi bezirgân katırlarını yükleyip yola verirler, kendileri de biraz daha çadırlarında kalırlar. Gidenler ise bir zaman gittikten sonra bir dağın başına varırlar ki ot derya deniz. Otu gördüğü gibi Ahmet hizmetkârlara seslenir:",
      "“Ulan hizmetkârlar, eyleyin!” Eylenirler.",
      "“Yıkın şuraya katırı!”",
      "“Etme kardeş, gitme kardeş, burası haramilerin yeridir, biz burada yatamayız. Haramiler bizim malımızı talan ederler, bizi bütün kırarlar. Haydi çekip gidelim.”",
      "“Ulan ‘yıkın!’ diyorum size. İğne giderse ben çuvaldız öderim.”",
      "Hizmetkârlara zaten ağaları emir vermişti. Bunlar orada yıktılar, diğer altı tanesi kaçtılar. Geriden bezirgânlar geldiler, malların sahipleri:",
      "“Ahmet oğlum, niye yıktın buraya?”",
      "“Baba, senin neyin lâzım?”",
      "“Oğlum, burası haramilerin yeri.”",
      "“Baba sen gir çadıra, iç kahveni, keyfine bak. Senin iğnen giderse ben çuvaldız ödeyeceğim.”",
      "Hizmetkârlara emir verir, hepsi yatarlar, bezirgânlar da yatarlar, Ahmet de yatar. Gel haramilerden haber verelim.",
      "Haramiler dağın başına çıktılar, Köroğlu’nun Çamlıbel’i gibi, salıvermiş herif hayvanı, yatıyor. “Ulan, bunu vuralım, tutalım.” Haramibaşı der ki:",
      "“Yok, biz buraya gidemeyiz, bu tek atlı tekin değildir. Biz kırk yıldır bu dağda gezeriz, buraya kimse gelmedi. Burada kuş uçmaz, kervan yürümez. Bunda bir tutar olmasaydı, bir güveneceği olmasaydı kervancı buraya yıkamazdı. Siz şu ileri gidenlere bakın hele.”",
      "İlerden gidenleri bastılar, nereye gittilerse gidip vurdular, kırdılar, talan ettiler. Yükte yeğnik, pahada ağır malları toplayıp gittiler.",
      "Haberi kimden verelim, beriki bezirgânda, Ahmet’in kolundan. Sabahtan kervanı yükleyip salıverdiler. Gittiler ki ne görsünler: İlerdekileri elleri koynunda, başlamışlar ağlamaya. Sorarlar:",
      "“Ulan, ne oldu size?”",
      "“Biz bütün talan olduk, sen ne hikâye yapıyorsun?”",
      "“Bize hiç ‘Çıt’ eden olmadı, kendimiz de uyukladık. Malımız da adamakıllı rahat etti, biz de rahat ettik.” Ahmet’e döndü:",
      "“Ahmet oğlum, aylığın oldu yedi yüz lira, önde giden perşenk yüklü katır da yüküyle beraber senindir.”",
      "Bunlar sürdüler, ömürleri de neleri varsa yüklediler, gittiler. Bezirgânlar yine geriden geliyorlar. Yolda giderken hava bozdu, gök gürledi, şimşek çaktı. Ahmet seslenir:",
      "“Hizmetkârlar!”",
      "“Efendim.”",
      "“Yıkın şuraya!”",
      "“Etme ağa, gitme ağa, çıkalım o yüksek yere de orada yıkalım. Buraya yıktık mı, gök gürlüyor, şimşek oynuyor, afet olacak, afetin içinde kalacağız.”",
      "“Lan yık, it oğlu it. Gereğini ben düşünürüm, siz yıkın!”",
      "Yıktırır oraya. Öbürleri yine kaçtılar, güya bir selâmete çıktılar. Ahmetlerin yattığı yere damla düşmedi; sabahtan yükleyip yola çıktılar ki ne çıksınlar, onların bütün malları suyun içinde kalmış. Sorarlar:",
      "“Baba nedir sizin bu haliniz?”",
      "“Gece sele kaldık.” Bezirgân, Ahmet’e seslenir:",
      "“Ahmet, ikinci katır da senin, aylığın da bin lira oldu.”",
      "Sürüp yola devam ederler. Şehrin kenarına yaklaştılar. Şehre girmeyip malları şehrin kenarına yıktılar, orada yattılar. Geriden bezirgân geldi:",
      "“Ahmet oğlum, ne ediyorsun? Herkes gitti, malını akşamdan satacak, bizim malın kıymeti daha kalmayacak. Sabahtan malın kıymeti düşecek, biz mal satamayacağız.”",
      "“Ağa, sen otur yerinde, neyine lâzım. Onların yüz paraya verdiğini ben beş kuruşa vereceğim. Sen yerinde otur.”",
      "Orada yattılar. Sabah olunca bunlar çarşıya girerken akşamdan gidenler dışarı çıkıyorlar:",
      "“Ne ettiniz, kaça alıp, kaça sattınız?”",
      "“Yüzer paraya sattık.” Ahmet çarşıya girdi:",
      "“Beş kuruş, beş kuruş!”",
      "Dayandı mal gidiyor. Bezirgân, Ahmet’e seslenir:",
      "“Ahmet üçüncü katır da senin oğlum, aylığın da bin iki yüz lira.”",
      "Ahmet kendine verilen üç katırın yükünü satar, alacaklarını alıp yükler. Evvelce nereden geldiler? Trabzon yolundan; bu sefer döndüler Erzurum yolundan, Urfa, Diyarbakır taraflarına. Bir çöle vardılar, tek kuyu var. O kuyudan yedi gün, yedi gecelik su alacak hayvanlarına ve kendilerine. Yedi bezirgânın altısı vaktiyle su vermeye girmiş, orada kalmışlar. Şimdi sıra Ahmet’in.",
      "“Ahmet oğlum, gel yanıma.” Ahmet bezirgânın yanına gelir:",
      "“Nedir ağa?”",
      "“Oğlum, biz yedi taneyiz. Bunlar benim arkadaşım ama, aslında arkadaşlarımın oğullarıdır. Ben bunların babaları ile arkadaş idim. Altı tanesi sıra ile girdi, bu kuyuda kaldı. Şimdi sıra bana geldi. Oğlum şimdi suyu girip ben vereceğim. Çıktım, ne âlâ; mal benim. Çıkmadım, bu mal senin, bu saltanat senin. Evde de bir kızımla bir ailem var. Ailem annen, kızım da senin ailen. Ben ineceğim bu kuyuya.”",
      "“Yok, ne münasebet ki sen inesin. Kuyuya ben ineceğim.”",
      "“Ulan oğlum, ben gittim mi, senin annen var, bacın var. Bunlar bana ne der?”",
      "Ahmet bir senet yazıp onlara da imzalatır, hizmetkârlara da imzalatır: “Ben kendi gönlümle bu kuyuya iniyorum. Yedi saat beklersin, çıkarsam ne âlâ. Çıkmazsam yedi gün beklersin. Yine çıkmazsam yedi gün üzerine bir daha geleceksin. Çıktım ne âlâ, çıkmazsam kanım sana helâl olsun. Ama, bekleyeceksin.”",
      "“Peki.”",
      "Taktılar âleti beline, astılar kuyuya. Yedi günlük su çekip verdi yukarı:",
      "“Asıl halatı, geleyim.”",
      "Halattan tutacağı sırada bir Arap bileğinden sarılır, çekip alır götürür bunu. Girdiği ne konak! Yeryüzünde acaba öyle bir konak var mı? Sedirde oturmuş bir delikanlı; ayın on dördü, günün on beşi bir kız; bir tarafta altın sinisi; meydanda sinisinin üzerinde yeşil kurbağa. Ahmet oraya girer:",
      "“Selâmünaleyküm.”",
      "“Aleykümselâm.”",
      "Delikanlı oradaki kızı çağırıp der ki:",
      "“Kardeşim, al bu yiğide odaları gezdir.”",
      "Aldı Ahmet’i kız, peşine gitti. Açtı bir oda; içerisi insan kellesi. Açtı bir oda; içerisi insan bacağı. Açtı bir oda; insan cendiği. Ahmet dedi ki:",
      "“Adın ne senin?”",
      "“Ahmet.”",
      "“Ahmet, kardeşim sana bir sual soracak. Sualine cevap verdin, yakanı kurtardın. O zaman sana der ki: ‘Dile dileğini, vereyim muradını.’ Sen de dersin ki: ‘Babanın kırk senedir el değmemiş bağından bir terki nar ver bana.’ Sana her ne derse desin, ne verirse versin; inci, cevahir, altın, yakut, hepsini reddet. ‘Bana bir teneke nar vereceksin’ diyeceksin.”",
      "“Peki.”",
      "“Yok, eğer kardeşimin muradını yerine getiremezsen sen de bunlar gibi olacaksın. İşte görüyorsun.”",
      "“Peki.”",
      "Ahmet dönüp kızın kardeşinin karşısına oturur. Delikanlı Ahmet’e sorar:",
      "“Delikanlı, sana bir sorum var. Buna cevap vereceksin.”",
      "“Peki.”",
      "“Ben mi güzel, kız mı güzel, Arap mı güzel, sininin üzerindeki kurbağa mı güzel?”",
      "Ahmet bir düşündü: “Biz ne dedik hocaya, hoca ne dedi bize: ‘İlmin başı sabır, sabrın başı neydi, selâmet, gönül kimi severse güzel odur.’” diyene kadar oğlan hiddetlendi:",
      "“Arap, kılıcı hazırla! Ne söylüyorum sana; ben mi güzel, kız mı güzel, Arap mı güzel, sininin üzerindeki kurbağa mı güzel?”",
      "“Ne senden korkarım, ne Araptan korkarım, ne kılıçtan korkarım. Ben şu noktayı düşünüyorum. Ne bağırıyorsun, bağırmakla beni korkutamazsın, kılıç ile de korkutamazsın. Sualini tekrar et.”",
      "“Ben mi güzel, kız mı güzel, sininin üzerindeki kurbağa mı güzel, Arap mı güzel?”",
      "“Gönül kimi severse güzel odur.”",
      "Kurbağa yavaş yavaş şişmeye ve büyümeye başladı. Delikanlı bir daha sordu:",
      "“Doğru söyle, ben mi güzel, kız mı güzel, sininin üzerindeki kurbağa mı güzel?”",
      "“Çok söyleme, gönül kimi severse güzel odur.”",
      "Kurbağa biraz daha şişip büyüdü:",
      "“Doğru söyle, ben mi güzel, kız mı güzel, sininin üzerindeki kurbağa mı güzel?”",
      "“Arkadaş patlama, gönül kimi severse güzel odur.” demesiyle kurbağa patlayıverdi. Oğlan bunun nikabını çekip alır. Bir kız dikiliverir, ne oradaki kıza, ne delikanlıya, ne de araba benzer; sanki gün vurdu içeri! Delikanlı Ahmet’e der ki:",
      "“Dile dileğini.”",
      "“Arkadaş, benim senden hiçbir dileğim yok.”",
      "“Dilek dile, dilek!”",
      "“Dileğim odur ki, babanın el değmemiş bağından bir terki nar isterim.”",
      "“Arkadaş, narı ne edeceksin, dünyada her ne istersen iste benden; altın iste, yakut iste, inci iste, ne istesen iste.”",
      "“İstemem, bir terki nar isterim babanın el değmemiş bağından.”",
      "“Kalk kız, şu terkiyi al da bağdan nar doldur, gelin.”",
      "Kızla Ahmet bağa gittiler. Kız ile terki narlarla doldururken birkaç tane de cebine atar. Oradan delikanlının yanına gelirler. Ahmet der ki:",
      "“Beni aldığın yere götür bakalım.” Oğlan, Arap’a seslenir:",
      "“Bunu nereden aldınsa oraya bırak.”",
      "Arap yukarı seslenir: “Asın, al atı asın!”",
      "Yukarıdan al atı asarlar. Ahmet’i yukarı çekip alırlar. Oradakilere aşağıda başından geçen serencamı anlatır. Terkiyi de katırlarının üzerine atar. Allahısmarladık’ı çekerler:",
      "“Allahısmarladık sizi, duadan unutmam biz; sağ isek inşallah göreceğiz birbirimizi.” Sürüp geldiler memleketlerine.",
      "Ahmet gittikten sonra padişahın kızı elindeki külçeyi satıp padişahın konağından âlâ bir konak hazırlar; başıyla, bahçesiyle her şeyiyle. Ahmet dolandı geldi eve, evine girecek. Sürüp sokaktan gelir, çıktı ki ne gelsin: “Biz padişahın köşküne geldik, yolu yanlış mı geldik? Ne ettik biz, hele geri dönelim bakalım.” Meydandan bir daha dolanır, yine aynı sokağa gelir, aynı konak: “Biz yine yanlış geldik, padişahın konağına geldik.” Tekrar dolaşmaya gider.",
      "Haberi kimden verelim, padişahın kızından. Padişahın kızı konağın penceresinden dışarıyı seyrediyor. Tembel gelir, geri döner; gelir, yine döner. Padişah kızı cariyelere seslenir:",
      "“Kızlar!”",
      "“Emret hanım.”",
      "“Gelen Ahmet’tir. Yakalayın, erteğinden, merteğinden; hiç ayaklarını yere vurdurmadan yanıma çıkarın.”",
      "Kızların elleri ellerine, etekleri bellerine, ökçeleri büzüklerine değerek, sekerek, dökerek geldiler, indiler. Ahmet’i kapmaları ile “Kızlar durun, nedir sizin derdiniz, nedir zorunuz?” derken kapıp padişahın kızının karşısına getirmeleri bir olur:",
      "“Ahmet, nedir bu halin?”",
      "“Bacı, ben şaşırdım, gelemedim.”",
      "“Ahmet niye gelemiyorsun?”",
      "“Bacı, ben gittiğimde bu düzen, bu konak yoktu.”",
      "“Hele gel bakalım.” Ahmet de cebinden narları çıkartıp padişahın kızına verir, heybeyi de çıkartıp ortaya koyarlar. Kız narları gördüğü gibi:",
      "“Kızlar, herkes yerine!” diye çıkışır. Kızlar yerlerine çekilirler.",
      "“Ahmet, bunları nereden buldun?”",
      "“Bacı, terki hep ondan.”",
      "Padişahın kızı terkiyi açtı ki ne görsün, hep ondan, olduğu gibi nar.",
      "“Kalk Ahmet, daha durma. Padişahın olanca askerini, hepsini davet edip buraya getireceksin. Gidip padişahı davet edeceksin. Hangi gün, hangi saatte geleceğini sana söylesin.”",
      "“Peki.”",
      "Ahmet daha yerine oturmadan padişahın yanına gider, padişaha bir resmi tazim yapar:",

      "Padişahın kızı hazırlığını görür, aşçılar getirir, etini kasaplarla kontrat eder, her şeyini hazır eder. Padişah da dediği saatte gelip konağa misafir edilir, askerler yerleştirilir. Padişahın yemek yiyeceği yere bir perde çekerler, arkasında kızı oturur. Kız arkadan yemekleri verir, Ahmet de sofraya koyar. Kız yemeklerden birini tuzlu yapar, birini de tuzsuz yapar. Önce tuzlu yemeği verir. Padişah bu yemeği vezirleri ile beraber yer. İkinci yemeği alınca bir lokmadan fazla yiyemez. Öteki tarafa sürer. Arkasından tuzlu bir yemek verirler, padişah başlar bundan yemeğe:",

      "Padişah bunu der demez kızı perdeyi açıp babasının karşısına dikilir:",
      "“Baba, ben seni ‘Tuz kadar severim’ dediğim zaman bu Tembel’in yanına atmıştın ki dilenip deşireyim. Allah, öyle bir Allah’tır ki bak, işte Tembel’i ne hale getirdi; senin köşkünden âlâ köşk yaptırdı, senin havuzundan âlâ havuz yaptırdı, senin bağından âlâ bağı var. Bu hale gelene kadar bu benim kardeşim idi, ben de onun bacısı. Biz daha kardeş bacıyız. Şimdi bu saat bizim akdimizi icra edeceksin.” deyip kız perdenin arkasına çekilir. Padişah da hemen Ahmet’i kızına nikâh eder.",

    "source": "Boratav, Pertev Naili; Zaman Zaman İçinde. İstanbul: Adam Yayınları, 1998.",
    "paragraphs": [
      "Bir varmış, bir yokmuş. Evvel zaman içinde, kalbur saman içinde… Bir adamcağız varmış. Bunun bir tane, on iki on üç yaşlarında, kıymetli bir kızı varmış. Kızın anası ölmüş. Babası “Kimi alayım, kimi alayım?” diye düşünür dururmuş. Kızın hocası:",
      "“Kızım babana söyle beni alsın, Ben sana şöyle bakarım, böyle bakarım…” demiş. Kız da gelmiş eve:",

      "“Bu da kızdır, gençtir; varsın gitsin, bir an eğlensin,” der. Adam da razı olur. Kadın bunun üzerine:",

      "Kız gider, kırlarda arkadaşlarıyla güler, oynar… Artık iyice karnı acıkmış, annesi görünmüyor… Neyse, epey bir zaman sonra kadın gelir. Meğer, evde zehir gibi tuzlu bir boğaça yapmış. Bir testiye de su doldurmuş, içine bir yılan yavrusu koymuş… Kız boğaçayı yer. Az sonra susar. Diker testiyi, buz gibi suyu kana kana içer, yılanı da yutar, haberi yok kızcağızın…",
      "Kızın hali değişir, gün günden karnı şişer. Kadın ebelere gösterir. Kocasına der ki bir gün:",
      "“Ah, yahu, o gün ben senin sözünü dinlemedim, kızı kıra gezmeye gönderdim. Herhalde birine kanmış, gebe kalmış …”",
      "Adam da pek namuslu imiş. Bu iş pek gücüne gider. Kızını da çok severmiş. Gece uykuları kaçar. Kızını yüzlemeye, dövüp sövmeye de kıyamazmış. Bir gün, artık dayanamamış, kızına:",
      "“Haydi, seni gezmeye götüreyim,” der. Bir dağın tepesine çıkarır. Orda bir ağacın altına otururlar.",
      "“Kızım, yoruldun yat dizime de sana ninni söyleyeyim, uyu,” der.",
      "Kız yatar babasının dizine. Babası ninni söylerken, söylerken, uyur. Adam o zaman bir kamışın içine bir arı koyar, kızın başucuna asar, bırakır gider. Arı kamış içinde vızıldadıkça kız da babası ninni söylüyor sanırmış… Nihayet uykusunu iyice alır, uyanır, bir de bakar ki, bir arı başucunda vızıldıyor, babası gitmiş… Başlamış ağlamaya:",
      "“Ah benim halim ne olacak?” diye dövünür, karnı da büyümüş, içi lombur lombur edermiş. “Bütün bunlar üvey anamın tuzağı…” der kızcağız, ne edeceğine şaşırmış, başlar dağdan aşağı inmeye… Bir dere kenarına varır. “Şurada bir abdest alayım, Allah’a sığınayım. Bakalım Allah ne gösterir,” der. Dereye gelmeye… Derenin içinden de başka bir ses buna cevap vermiş… Bir de ne görsün, ağzından kağış kağış, bir yılanla yavruları çıkmasın mı? Kızcağız hafifler, ferahlar. Ama dağ başında, yapayalnız kalmış… Kalbi mahzun, düşüne düşüne bir yol tutturur, gider gider…",
      "Ortalık kararmaya başlamış… Uzaktan bir ışık görür: “Şuraya gideyim, belki beni alırlar,” der. Varır o ışığın olduğu eve, kapıyı çalar. Açarlar. Meğer orası Kırk-Haramiler’in evi imiş. Bunu gören Haramiler:",
      "“Kız senin burada ne işin var?” derler. Kız da başından geçenleri anlatır:",

      "Kırkı da bir odaya girerler, başlarlar müzakereye:",
      "“Birimiz alsak, birimiz ister; birimiz alsak birimiz ister… Bize sığınmış namuslu bir kız, başka türlü de edemeyiz. En iyisi bunu kırkımız kardeş edinelim,” derler. Gelirler:",
      "“Kız, derler, sen bizim dünya ahiret kardeşimiz ol. Biz getirelim sen pişir. Otur, keyfine bak…”",
      "“Peki,” der kız da. Artık bunlar kardeşlerini öyle severler, öyle severlermiş ki, dünyada, üstüne toz konduramazlarmış. O da onları severmiş…",
      "Kırk-Haramilerin evinde oturmakta olsun… Biz gelelim analığa…",

      "“Eyvah, der, kaltak ölmemiş. Bu iş gizli kalmaz, meydana çıkar. Şimdi ben ne yapayım?”",
      "Hemen kocasına gider: “Aman kocacığım, der, yavrucağızı nerelere bırakmıştın? Rüyama girdi… Aç mıdır, susuz mudur? Gideyim arayayım.”",
      "Adamcağızın da o gün, bugün, iki gözü iki çeşme, kızının derdinden erimiş bitmiş, dünyadan elini eteğini çekmiş… Karısının bu düşüncesine içinden sevinir. Gider kadına bıraktığı dağı gösterir.",
      "Kadın bir sepet kiraz alır, hepsini zehirler. Takar koluna sepeti. Kocasının gösterdiği yerden aşağıya doğru yürür. Gider, gider, uzakta bir ev görür. “Mutlaka buraya sığınmıştır,” der. Ama kendisini bir başka kıyafete sokmuş: Bir ferace giymiş, bir gözü açık öteki örtülü… Yürür eve doğru… Kız da işini bitirmiş, gelir, “Kiraz satıyorum, kiraz…“ diye kapının önüne. Kız da:",
      "“Kiraz alayım da, pencerenin önünde oturayım,” der.",
      "Hemen çıkar, yarım okka kiraz alır… Oturur pencerenin önüne, kirazlarını yiyecek… Penceresinin yukarısında da kırk tane kuş varmış, kafeste, onlarla eğlenirmiş. Kuşlar başlar: “Cik cik, cik cik cik…” diye kiraz istemeye. Bir tane ona vereyim, bir tane ona derken sepette kiraz biter. Kıza bir tane bile kalmamış. Kız bir de bakar ki, kirazı yiyen kuş ölüyor, yiyen ölüyor… Oturur pencerenin önüne, iki gözü iki çeşme ağlar, kızcağız. Kuşlarını pek severmiş… Akşam olur, kardeşleri gelir.",

      "Kırk-Haramiler:",
      "“Sen sağ ol, kardeş, biz sana daha güzellerini getiririz, derler. Sakın bir daha kapıdan geçen bir şeyden alma… Ya sen ölseydin?”",
      "Ertesi gün evvelkilerden güzel kırk tane kuş getirirler, kafeslere koyarlar.",
      "Ardından bir ay geçer, yeni ay doğar. Analık çıkar ayın karşısına:",

      "“Ah, kaltak kız, ölmemiş…” diye, bu sefer gider kadın, bir kâğıt sakız alır. Sakızı zehirler. Gene varır Haramilerin evinin önüne: “Sakız satarım, sakız satarım…” diye geçmeye. Kız kendi kendine: “Bu yenecek şey değil ya… Alayım…” der, alır kadından sakızı, kuşlar gene başlar ötüşmeye: “Cik, cik, cik, bana, bana…” diye. Kız der ki:",
      "“Durun, çiğneyeyim de öyle vereyim.”",
      "Sakızı atar ağzına, bir iki çiğnerken, düşer serilir olduğu yere.",
      "Akşam olur, kardeşleri gelir bakarlar ki, kız serili yatıyor.",
      "“Eyvah, kardeşimiz ölmüş. Biz nasıl dayanalım bunun acısına. Nasıl gömelim topraklara?” diye ağlaşırlar. Bir tabut yaptırırlar. İçine kızı koyarlar. Artık nereye giderlerse, bu tabutu taşırlarmış.",
      "Bir gün bunlara bir padişahın oğlu rastgelmiş… Der ki şehzade:",
      "“Sormak ayıp olmasın ya, ben size kaç kere rastladıysam hep bir tabutla gördüm. Bunu neden böyle taşırsınız?”",
      "“Ah, sorma, derler Kırk-Haramiler, biz kırk tane kardeşiz, bir tek bacımız vardı. O bacımız öldü. Kıyamıyoruz toprağa gömmeye. Böyle taşıyoruz.”",
      "Bunun üzerine Şehzade der ki:",

      "Şehzade:",
      "“Namusumun üzerine söz veriyorum ki gömmem. Ölünceye kadar kendi odamda saklarım,” der. Kırk-Haramiler tabutu verirler.",
      "Şehzade alır bu emaneti, odasına koyar. Ama merak da eder. Bir de açar bakar ki, ne görsün, ne görsün, dünya güzeli bir kız. Mum gibi sararmış, güzelliğinden zerre kaybetmemiş. Oğlan deli olur. Kızı kaldırır, köşeye oturtur. O günden sonra, kapıyı kilitler; kimseyi içeri koymazmış. Akşamüstü odasına güle güle girermiş, sabahleyin ağlaya ağlaya çıkarmış.",
      "Bir lalası varmış oğlanın, dikkat eder, bu oğlan gün günden sararıyor, yemiyor, içmiyor. Merak eder. Çilingirden bir anahtar uydurur kapıya. Bir gün girer içeri. Bakar ki ayın on dördü gibi bir kız, sapsarı, cansız yatıyor. Ama ölüye benzemiyor. İhtiyar adam, tecrübeli ne olsa, anlar ki bu sağdır. Orasını eller, burasını eller. Bir de bakar ki avurdunda sert bir şey. Sokar parmağını, çıkarır, bir sakız. O saat kız: “Hapişuuuu, hapişuuuu…” diye aksıraraktan uyanır, gözlerini açar, bakar ki başucunda yabancı birisi.",
      "“Aman, burası neresi? Kardeşlerim nerde? Kuşlarım nerde? … “ diye başlar ağlamaya…",

      "Sonra, beyoğlu ile Nardaniye Hanım kırk gün kırk gece düğün yapıp evlenirler. Beyin oğlu kızın başından geçenleri dinler. Babasını getirtir. Adamcağız, kederinden bir kara top olmuş… Beyoğlu sorar:",

  {
    "id": 3,
    "title": "Üç Turunçlar",
    "category": "Aşk ve Arayış",
    "readingTime": "10 dk",
    "motif": "Beddua, devin kalesi, büyülü turunçlar, güvercin, kavak ağacı ve sabır",
    "summary": "Kırdığı testinin bedduasıyla üç turunçların peşine düşen şehzadenin, devin kalesinden kurtardığı turunç güzelini hilekâr çingene kızına kaptırması ve yaşanan dönüşümler sonrası hakikate ermesini anlatan efsanevi masal.",
    "source": "Türk Folklor Araştırmaları Dergisi, 1968, sayı: 227",
    "paragraphs": [
      "Varmış, yokmuş Allah’ın kulu çokmuş. Çok söylemesi günah, söyleneni dinlememek çok ayıpmış.",
      "Vaktin birinde, bir memleketin bir padişahı varmış. Padişahın da bir tanecik oğlu varmış. Günlerden bir gün bu şehzade balkona çıkmış. Balkondan şehrin orta yerindeki pınar görünürmüş. Şehzade balkondan pınara gelip su dolduran kadınları gözlemiş. Bir tane yaşlı kadın da su doldurmaya gelmiş. Şehzade bir taş alıp atmış. Yaşlı kadının testisini kırmış. Yaşlı kadın şehzadeye dönmüş:",
      "“Sana bir şey demem oğul. Sen olasın üç turunçların aşkına düşesin. Sararıp solasın,” demiş ve gitmiş. Şehzadeyi o günden sonra bir ateştir almış. Üç turunçlar demiş de başka bir şey dememiş. Padişah oğlunun haline üzülmüş. Sultan Hanım oğluna:",
      "“Oğlum, bir tanecik oğlum, niye bu hallere düştün. Sana memleketimizin en güzel kızını alalım,” demiş. Şehzade:",
      "“Anam” demiş, “anam ben istemem, dünya güzelini getirseniz bile üç turunçları arayıp bulacağım. Ya bulup getireceğim, ya bu yolda öleceğim,” demiş. Heybesini doldurmuş. Atını eyerlemiş. Demir çarık, demir âsa düşmüş yollara.",
      "Az gitmiş, uz gitmiş. Dağlar aşmış. Düzler geçmiş. Gide gide bir ormana varmış, bakmış ormanda bir in. İnde iki tane aslan yavrusu.. Büyük bir yılan da yavruları yemek için hücum ediyormuş. Yılanı öldürmüş. Yavruları kurtarmış. Bakmış ana aslan topallıya topallıya geliyor. Ana aslan gelince yavrularını bu adam öldürdü sanmış. Parçalayacakken, yavruları yılanı göstermişler. Ana aslan her şeyi anlamış. Şehzadeyi çağırmış. Şehzade aslanın yanına yaklaşınca bakmış sağ ön ayağı şişmiş. İltihap dolmuş. Şehzade:",
      "“Aslan ana” demiş. “O ayağına ne oldu ki, ver bakayım ne varsa çıkarayım. Belki iyileştiririm.” Ana aslan ön sağ ayağını uzatmış. Şehzade ayağa bakmış ki koca bir diken var. Dikeni çekip çıkarmış. Yaraya eliyle basmış. İçindeki iltihapla pis kanı temizlemiş. Yarayı silmiş, güzelce. Aslan rahatlamış ayağındaki yara temizlenince. Şehzadeye dönmüş:",
      "“İnsanoğlu” demiş, “bana bugün iki büyük iyilik ettin. Birinci yavrularımı kurtarıp bana bağışladın. Sonra beni acıdan kıvrandıran ayağımdaki yarayı temizleyip iyileştirdin. Sana nasıl yardım edeyim?” diye sormuş. Şehzade:",
      "“Aslan ana, benim yaptığımda ne var ki, herkes o şekilde hareket ederdi. Bana yardım etmene gelince, hiç sanmıyorum. Çünkü ben yıllardır üç turunçları arıyorum. Aradığım halde ne yerini buldum, ne yerini bilene rastladım,” demiş.",
      "Aslan ana sevinçle:",
      "“İnsanoğlu sana umduğundan çok yardım edeceğim. Çünkü yerini biliyorum üç turunçların,” demiş. Şehzade heyecanla:",
      "“Söyle ana söyle ana,” demiş. Aslan ananın boynuna sarılmış. Aslan ana:",
      "“Şimdi bu dağı aşacaksın bunun arkasında bundan daha yüce bir dağ var onu da aşacaksın. Onun arkasındaki daha da yüce. İşte o dağın tepesine çık. Tepede büyük bir devin büyük bir kalesi var. Kalenin bir kapısı açık, biri kapalı. Bir kapıda bir köpek bağlı, birinde koyun. Koyunun önünde et var, köpeğin önünde de ot. Kale kapısına gelince koyunun önündeki eti köpeğe ver, köpeğin önündeki otu da koyuna. Kalenin açık kapısını kapat, kapalı kapısını aç ve içeri gir. Yolun her tarafı böğürtlenlerle dolu. Böğürtlenlerin dikenleri yoluna devam ettirmeyecekler seni. Sen böğürtlenleri elinle okşa ve “Oh! Ne güzel güllermiş” de, böğürtlenler sana yol verecekler. Bir ağacın altında bir dev göreceksin. Devin gözleri yumuksa, bil ki uyanık, sesini çıkarma. Gözleri açıksa da dev uyumuştur. Ağacın başında üç tane turunç var. Yerden bir taş al, Bismillah de, taşı at. Üç seferde düşüremezsen taş kesileceksin. Oradan çıkarken de sakın arkana bakma. Turunçları da su kenarında kes,” demiş. Şehzade helâllaşıp yola koyulmuş.",
      "O dağı aşmış. Ardından ondan daha yüce bir dağı aşmış. Derken üç turunçların bulunduğu hepsinden yüce dağa gelmiş. Dağın tepesine varmış. Bakmış büyük bir kale var. Kalenin iki kapısından biri açık biri kapalı. Kapılardan birinin önünde bir koyun, koyunun önünde de bir parça et duruyormuş. Bir kapının önünde de bir köpek yatıyormuş, köpeğin önünde bir kucak ot varmış. Koyunun önünden eti almış, ite vermiş, itin önündeki otu da koyuna vermiş. Kalenin açık kapısını kapatmış, kapalı kapısını açıp içeriye girmiş. Bakmış her taraf böğürtlen. Bir girmiş böğürtlenlerin içine. Dikenler her yanını kanatmış. Aslanın dediklerini hatırlamış ve böğürtlenleri okşamış:",
      "“Aman ne güzel güller” demiş. Böğürtlenler Allah’tan açılmışlar yolun iki yanına doğru. Şehzade ilerlemiş. Bakmış bir turunç ağacı. Ağaçta üç tane turunç varmış. Ağacın altında da bir dev uzanmışmış. Devin gözleri açıkmış. Şehzade devin uyuduğunu anlamış. Yerden bir taş almış;",

      "“Su. Su.” Demiş. Şehzade suyu nereden bulsun. Turunç güzeli ölmüş. Bir müddet daha gitmiş. Yine su bulamamış. Ortanca büyüklükteki turuncu da kesmiş. Bu turunçtan daha da güzel bir kız çıkmış. O da:",

      "Şehzade gidince kız bir ağacın tepesine çıkmış, kimse görmesin diye. Biraz sonra elinde testisiyle bir çingene kızı pınara su almaya gelmiş. Kara kapkaraymış. Çirkin, pis bir kızmış. Göle eğilmiş çingen kızı. Suda turunç güzelinin aksini görmüş. Kendi kendine:",
      "“Ben ne güzelmişim de haberim yokmuş,” demiş. “Padişaha gelin olacak kadar güzelim” demiş. Elini saçına götürüp düzeltmek istemiş. Bakmış göldeki aksi elini kaldırmıyor. Şaşmış kalmış. Sağa sola bakmış ağacın üstündeki turunç güzelini görmüş. Çingen kızı:",
      "“Bacı, bacı” demiş. “Niye öyle ağacın tepesinde oturuyorsun. İn aşağıda iki laf edelim,” demiş.",

      "Onlar dövüne dursun. Hani o şehzadeye: “Üç turunçların aşkına düşersin” diyen ihtiyar kadın vardı ya. İşte o bir gün gene su testisini almış. Pınardan su dolduruyormuş. Padişahın sarayının kapısı önünden geçerken yerde güzel bir tahta parçası bulmuş. Bu beşiğin, hani şu çingenenin parçalatıp attığı beşiğin parçasıydı. Almış eve getirmiş. Bıçakla yontup testinin ağzına kapak yapmış. Nene karının iki tane de ineği varmış. Her gün bu ineğini otlatmaya gidermiş. Evden çıkar çıkmaz testinin kapağındaki tahta fırlayıp turunç olup evi barkı süpürmüş. Yemeği hazırladıktan sonra da tahta olup testinin kapağı olurmuş. Gene nene karı şaşıp kalmış. Bir gün bekleyeyim “Bu in mi, cin mi” göreyim, demiş. İneği götürür gibi yapmış kapının anahtar deliğinden gözlemiş, bakmış kapak fırladı ayın on dördü gibi bir kız oldu. Evi sildi, süpürdü, yemeği yaptı. Tam tahta olacağı sırada, nene karı kapıyı açmış. Kızı kolundan tutmuş:",

      "“Kal kızım,” demiş. “Evde işleri gör. Ben de ineğimizi otlatırım. Geçinip gideriz. Kimseye de söylemem hiç korkma,” demiş. Sonra da onlar geçinip dursunlar.",

      "“Nenem” demiş. “Gel biz de bir çorba yapıp götürelim. Belki şehzademiz iyileşir,” demiş. Bir erişte çorbası yapmışlar, bir tasa doldurup nene karıya vermiş. İçine de şehzadenin gölün kıyısında kendisine verdiği elmas yüzüğü atmış yollamış. Nene karıya:",
      "“Sakın” demiş, “sakın bunu kimseye verme. Kendi elinle şehzadeye ver. Yiyinceye kadar da bekle,” demiş. Nene karı sarayın kapısına gelmiş. Hizmetkârlar içeri sokmak istememişler. Şehzade gürültüyü duyup “Bırakın gelsin” demiş. Nene karı yukarı çıkmış. Şehzadeye:",
      "“Oğul” demiş. “Bir kaşık da nenenin çorbasından ye. Belki şifa olur,” demiş, yalvarmış. Şehzade nene karıyı kıramamış. Kaşığı daldırıp ağzına götürmüş. Bakmış ağzında sert bir şey var. Çıkarmış ki turunç güzeline verdiği yüzük. Turunç güzelinin sağ olduğuna inanmış. Yüzü gülmüş, nene karıya:",

      "“Kızın kaç yaşında, kocan ne iş yapıyor, kızının adı ne?” diye sormuş. Nene karı ne bilecek, Turunç güzelinin hikâyesini anlatmış. Şehzade hemen çingen kızıyla oğlunu bağlatmış. Babasına müjdeciler koşturmuş. Turunç güzelini nene karının evinden alıp gelmişler. Çingen kızına da:",

      "Gülperi ise turna olmazdan önce uzun bir süre insanlar âlemi içinde yaşamıştı. Hem Sinan’ı anlamak hem de kendini anlatmak istiyordu.",
      "Yemekten sonra biraz çevreyi dolaştılar. Döndüklerinde Gülperi Sinan’a bir teklifte bulundu. Her gece birisi bir konuda konuşacak, diğeri de konuyu derinleştirici sorular soracaktı. Bu anlaşmadan sonra uyudular.",
      "Denizden esen rüzgâr hışırtılı bir serinlikle dolaşıyordu dalların yapraklarında..",
      "Sinan sabahın yarı aydınlığında uyandı. Gülperi’nin yatağını boş görünce kaygılandı. Başucundaki nota baktı:",
      "“Uçmayı özledim.. Eski kılığıma döndüm. Gece tekrar geleceğim. İlk konuya hazırlan. Sevgiler..”",
      "Sinan ilk olarak Fatsa’yı ve halkın yaşantısını anlatmayı düşündü. İşe bilimle başlamak istiyordu. Ve iki bilim olduğuna inanıyordu. Biri doğanın tarihi, diğeri de insanın tarihi..",
      "İkisi de birbirinden ayrılamazdı. Toprağı ve üzerinde yaşayanları açıklamak bilimin görevi, anlatmak ise sanatın işlevi olabilirdi..",
      "Akşam Gülperi biraz gecikti. Sinan bu sürede masayı, hazırlıkları gözden geçirdi. Akşamın bitip gecenin başladığı yerde Gülperi boynunda zümrüt yeşili bir kolye, kulaklarında gümüş küpeler, parmağında Çin işi bir yüzükle çıkageldi.",
      "Sarılıp kucaklaştılar. Yemeğe ve sohbete geçtiler. İlk sözü Sinan aldı:",
      "“Bu Fatsa toprakları çok verimlidir. Dünyanın en güzel fındığı burada yetişir. Fındık çok önemli bir besin maddesidir. Ayrıca kabuğu da yakacak olarak kullanılır.”",
      "Gülperi sordu:",
      "“Halkın geçimi nasıl?”",
      "“Halkın çoğunluğu fındık üretir. Ancak fiyatı dış dünya, yani fındığı bizden talep edenler belirler. Bu yüzden dışa bağlıyız.”",
      "“Fiyatta oynama, ödemelerde gecikme olur mu?”",
      "“Evet, genellikle, işte tam da bu yüzden halk yoksul ve eğitimsizdir. Bölgede tefecilik yani yüksek faizle halkı borçlandırıp, hasat sonunda ürününü düşük fiyatla almak yaygındır. İnsanlar bir sene çalışır, ürünü satınca borcunu kapatır, tekrar borç-harç içinde geçinmeye çalışır. Elli altmış yıl bu biçimde yaşar, sonra da ölürler!..”",
      "“Bu topraklarda, bu coğrafyada güzellikler sayılamaz. Karadeniz’in yazın eşsiz bir güzelliği, kışın sert dalgaları vardır. İlkbaharda toprak çok coşkuludur. Doğada bir yeşillik patlaması olur. Börtü-böcek, ağaç-çiçek her şey uyanır, dallar meyveye durur, yağmur yüklü bulutlar yaylalara koşarak boşaltır sağanak damlalarını, yeşilin binbir çeşidi içinde kuşlar her gün senfoni sunar, yağmur sonrası güneş açar, ırmak ve derelerin vadilerinde ak bir sis bulutu dans ederek yükselir..”",
      "Sinan bu noktada sustu. Gülperi’nin yosun renkli gözlerine adeta kilitlenmişti. İlk kez öptü Gülperi’yi. O da sıkıca sarıldı Sinan’a..",
      "Uyudular. Sinan uyandığında güneş iyice yükselmiş, kuşların binbir çeşit ötüşleri etrafı kaplamıştı. Gülperi yine kılık değiştirip gitmiş, Sinan’ın içini yerleşik bir keder sarmıştı..",
      "“Ya bir daha gelmezse?”",
      "“Ya daha uğramazsa ben ne yaparım?”",
      "Kalktı. Açık havada kahvaltısını yaptı. Çıkıp köyde şöyle bir dolaşmak, çocukluk arkadaşlarını görmek, çocukken ineklerini otlattığı bahçeleri gezmek istedi.",
      "Yolda Dursun Baba’ya rastladı.",
      "“Selam baba, nereye?”",
      "Dursun Baba elindeki torbaya ağlarını, misinasını koymuş denize kavuşan ırmaklara doğru yönelmişti:",
      "“Balık tutmaya gidiyorum. Haydi, beraber gidelim.”",
      "Yol boyunca Dursun Babaya anlattı Sinan. Bu yollarda ne çok pabuç eskitmişti. Atları ile fındık çuvalları, mısır torbaları, meşe, gürgen, yaykın odunları taşımış, evden bahçeye dönerken de atı dörtnal sürmüş, bir-iki kez de attan düşmüştü.. Yoğun işleri olmadığı zamanlarda da inekleri otlatarak yine her gün bu yollarda bahçelerde çocukluğun artık bir daha geri dönmeyecek hazlarını yaşamıştı. Yaşamıştı ama o günler bunun farkında da olamamıştı. Cennette olup da cennetin farkında olamamak gibi.",
      "Irmağa yaklaştılar. Şimdi Sinan’ın fındık bahçesi Gökdikenden geçiyorlardı. Sinan hüzünle;",
      "“Bak” dedi, “şu elma ağacının dibi benim okuma yerimdi. İnekler yayılırken ben de burada roman, hikâye okur, yazarlarla selamlaşırdım. Bir gün ben de böyle şeyler yazabilir miyim, diye hayaller kurardım.”",
      "Dursun Baba Sinan’a dönerek;",
      "“İyi ya şimdi bir şeyler yazmışsın, hayallerin gerçek oluyor.”",
      "“Yazma isteği hep vardı. Bu toprakları ve insanlarımızı yazarak anlatmak. Türkülerin yanına bir de öyküleri koymak. Yaşadıkça yazmak, yazdıkça anlatmak..”",
      "Ilıca ırmağına ulaştılar. Dursun Baba çizmelerini giydi. Ağını düzenledi. Irmağın derinliklerine ilerleyerek serpti ağını. Az sonra yavaş yavaş çektiği ağın içinde balıklar kıpır kıpır can çekişmekte, ağın iplerine çarparak son ümitlerini de yitirmekteydiler.",
      "Akşam eve döndüklerinde sohbete çilingir sofrasında devam ettiler. Eski günleri andılar. Gecenin ilerleyen saatlerine doğru Dursun Baba ayrıldı.",
      "Az sonra kapısı çalındı Sinan’ın. Gelen, boynunda ak güvercin renkli kolyesi, kulaklarında zümrüt yeşili küpeleri, saçları karanfil kırmızısı, elinde bir eski defteriyle Gülperi’ydi.",
      "Sarılıp kucaklaştılar. Ve uzun süre öylece kaldılar. Yüreğindeki sevgi tomurcuğu büyümekteydi Gülperi’nin. Ve çağlayan olacaktı, denizin maviliğine, okyanusun derinliğine ılık bir meltem gibi taşıyacaktı onları. Bunu diledi içinden sessizce..",
      "Masaya geçtiler. Gülperi anlatacaktı şimdi de. Sinan bekledi söze girmesini..",
      "“Evrenin sırrının insanın içinde olduğunu, onun da zıtlıkların birlikteliğinden oluştuğunu” söyledi Gülperi.",
      "“Yani” dedi sonra, “hayat varsa, ölüm de var, acı sevinçle, sevgi nefretle, doğru yanlışla bir arada.”",
      "“Bu durumda mantıkla mantıksızlık da hep beraber, akılla duygu, aşkla kurallar çatışmalı olur.”",
      "Sinan; “Peki gerçek ne ile birlikte?”",
      "“Masalla” dedi Gülperi gülümseyerek. “Belki biz de bir masalı yaşıyoruz.”",
      "“Doğru” dedi Sinan; “uçmalara, kılık değiştirmelere bakılırsa…”",
      "Ama bu çağdaş bir masaldı. Her ikisi de yaşanmışlıklardan düşlere, düşlerden de öykülere dönüşen bir hayatı paylaşıyorlardı.",
      "Devam etti Gülperi anlatmaya. Çocukluğunu, yalnızlıklarını, özlemlerini.. Hayal kırıklıklarından acılarına, sevinçlerinden kırgınlıklarına kadar tüm yaşamından esintilerle özetledi yaşantı birikimlerini… Elindeki defterden kısa metinler okudu yer yer.",
      "Gülperi anlattıkça, Sinan; onun içinde gizli kalmış bir edebiyat okyanusu olduğunu, derinlerindeki dalgaların ancak onu gerçekten seven biriyle anlaşılabileceğini sezdi.",
      "Ve Gülperi’ye dönerek:",
      "“Bir insanı sevmekle başlar her şey” dedi.",
      "O da;",
      "“Evet, sevmekle başlar, emek ile anlaşılır insan. İnsan insanı oluşturur. Her şey gibi kişiler de değişir, gelişir, güzelleşir.”",
      "“Doğru kişiler birbirlerini bulursa gelişme hızlı ve güzel olur.”",
      "“Doğru kişiler doğru zamanda karşılaşırlarsa her şey daha güzel olur.”",
      "Uyudular.",
      "Sabah kuşları ötmeye, giderek artan bir senfoninin nağmeleri etrafa yayılmaya başlamıştı.",
      "Sinan her zamanki gibi erken uyandı. “Kuşlar niye bu kadar canlı ve sevinçli ötüşüyorlar?” dedi.",
      "Bu sesi duyan Gülperi;",
      "“Bir sevgiyi, bir aşkı mı kutluyorlar acaba?” dedi.",
      "Sinan Gülperi’nin yanında olduğunu görünce şaşırdı;",
      "“Aa bu sabah turna olup uçmamışsın?”",
      "“Artık göklerde değil, hep yanındayım” dedi Gülperi, Sinan’ın uzun yumuşak saçlarını okşayarak..",
      "Sinan sevinçle sarıldı Gülperi’nin boynuna. Öpüştüler zamanın ve evrenin sonsuzluğunda yitip giderek..",
      "Doğada ise kuş seslerinin ahenginde çoğalan bir müzik devam ediyordu. Bahçelerde ağaçlar ve ağaçların dallarında yapraklar bu müziğe uygun sessiz bir dansın salınımları içindeydiler..",
      "“Sen bilirsin” dedi Gülperi’ye Sinan;",
      "“Sen kuşların dilini çözersin, nedir bu bitmez senfoni?”",
      "Gülperi kendinden emin bir ifadeyle;",
      "“Evet canım, bu konser bizim için, biz de doğanın bir parçasıyız.”",
      "Fatsa’nın yükseğinde fındık bahçesindeki deniz gören bu ahşap evde Sinan ile Gülperi her akşam değişik bir konuda sohbet ederek ve buna zaman zaman köylüleri de çağırarak uzun yıllar birlikte yaşadılar.",
      "Geçen günlerde köyüme şöyle bir uğradığımda rastladım Dursun Baba’ya ve sordum Gülperi ile Sinan’ı…",
      "Yine karların eridiği ve güneşin toprağı ısıtmaya başladığı bir bahar sabahında ahşap evin önünden iki telli turnanın bir anda havalanarak gökyüzünün bilinmez maviliklerine doğru süzülerek gözden kaybolduğunu söyledi Dursun Baba bana, gözlerinden sızan iki damlacığı silerek…"
    ]

    "summary": "Derede ellerini yıkarken bileziğini kapan peri delikanlısı Hüsnü Yusuf'a âşık olan padişah kızının ve onu ararken yaşadığı gizemli serüvenin masalı.",
    "source": "Türk Folklor Araştırmaları Dergisi, 1964, sayı: 178",
    "paragraphs": [
      "Bir varmış bir yokmuş, bir padişahın bir tek kızı varmış. Bu kız her gün has bahçenin içinden akan bir derenin kıyısına oturur serinlermiş. Günlerden bir gün yine bu derenin kıyısında serinlerken, kolundaki bileziğini çıkarıp bir taşın üstüne koymuş, derede ellerini yıkarken kırk bir tane beyaz güvercin gelip yeşil çimenlerin üzerine konmuşlar. Bunlardan kırkı bir silkinişte kız, bir tanesi de yakışıklı bir delikanlı oluvermiş. Bütün bu olan bitenleri hayran hayran seyreden padişahın kızı, bileziğini koluna takmak için, dere kenarından kalkınca, yakışıklı delikanlı yeniden bir güvercin oluvermiş, taşın üzerinde duran bileziği boynuna geçirip uçup gitmiş. Kırk kızın kırkı da güvercin olup onun peşinden pırradak uçup gitmişler.",
      "Ondan sonraki günlerde kız yine has bahçedeki derenin kenarında oturmuş, güvercinleri beklemiş ama ne gelen, ne giden olmuş bir daha. Delikanlıya gönlünü kaptırmış olan kız derdinden hastalanarak yataklara düşmüş. Babası ülkenin en ünlü hekimlerini çağırtmış ama kızın derdine derman bulan olmamış. En son kızına bir hamam yaptırmış; her gelen, önce başından geçen ilginç bir olayı anlatır, ondan sonra yıkanırmış.",
      "Günlerden bir gün hamama genç ve güzel bir gelin gelmiş ve başından geçen şu olayı anlatmış:",
      "“Bir gün çayın kenarında çamaşır yıkarken, işimi bitirmek üzereydim ki, odunum bitti. O sırada otuz katır yükü odun geçiyordu yakınımdan. Peşlerine düşerek yürümeye başladım. Gittiler, gittiler, kayalık bir yerde bir kapının önünde durdular. Biraz sonra kapı açıldı ve katırlarla birlikte ben de içeri girdim. Girmemle kapının kapanması bir oldu. Yürüyerek bir merdivenden yukarı çıktım, bir odaya girdim. Burası bir mutfaktı. Nefis yemekler pişiyordu tencerelerin içinde. Birinin kapağını açtım. O sırada bir ses; ‘Bırak onu, açma kapakları. Onu peri padişahımızın oğlu yiyecek’ diye seslendi. Kapağı kapattım, mutfaktan çıkıp bir başka büyük odaya girdim. İşte o zaman ne olduysa oldu. Tam kırk bir tane beyaz güvercin doldurdu odayı. Kanatlarını çırpar çırpmaz, kırkı birer genç kız, biri de aslan gibi bir yiğit oluverdi. Delikanlı bir odaya girdi, elindeki kamçıyı yere vurarak şaklatınca, odanın her bir yanı tiril tiril titredi. Bunun üzerine:",
      "‘Sizler nasıl titriyorsanız, sevgilim de böyle titreyip inlesin’ dedi ve odadan çıkıp gitti. Ertesi gün katırlarla birlikte ben de bu garip yerden çıkıp evime döndüm.”",
      "Bunu duyan padişahın genç kızı:",
      "“Bütün hamam senin olsun, yeter ki beni oraya götür,” demiş.",
      "Ertesi gün katırların peşine düşen genç kız, açılan kapıdan içeriye giriyor, tencere kapaklarını kaldırıyor, karnını bir güzelce doyuruyor ve güvercinlerin gelmesini beklemeye koyuluyor. Görünmemek için de büyük odadaki dolaplardan birinin içine saklanıyor. Biraz sonra gelen güvercinlerden kırkı kız, biri de erkek oluyorlar. Bir de ne görsün? Delikanlı, gönül verdiği genç değil mi? Elindeki kamçıyı yere vurarak şaklatınca, her yer titreyip inlediği halde, kızın saklı olduğu dolapta ne bir hareket görülür, ne bir ses duyulur.",
      "“Ey dolap, kaç senedir kahrını çekiyorum da, sen niçin inlemiyorsun?” diye sorar delikanlı.",
      "“Ya Hüsnü Yusuf, içinde sevgilin saklı, onun için inlemiyorum,” diye dile gelen dolap karşılık verir. Dolabı açan delikanlı sevgilisini karşısında görünce, sevincinden deliye döner.",
      "Gel zaman git zaman, kız, sevgilisine, bir çocukları olacağını müjdeleyince; delikanlı:",
      "“Şimdiye kadar periler, senin burada olduğunu anlamadılar. Fakat anlarlarsa seni öldürürler. Ben seni, Padişah babamın sarayına götürüp, kapının önüne bırakırım. Sen de: ‘Hüsnü Yusuf’un başı için beni içeri alın’ dersin. Ben her gün seni görmeye gelirim,” diye kızın gönlünü alır, sonra da onu kanadına bindirip babasının sarayı önüne bırakır. O gece kız bir erkek çocuk doğurur.",
      "Bir gece, saraya gizlice giren Hüsnü Yusuf’la kızın konuştuklarını hizmetçiler görüyor ve gidip padişaha haber veriyorlar. Padişah kızı huzuruna çağırtınca, kız olan biteni bir bir anlatıyor. Ertesi gece Hüsnü Yusuf gelince yakalanıyor. “Serbest bırakmalarını, bırakmadıkları takdirde perilerin hepsini öldüreceklerini” söylüyorsa da, gene bırakmıyorlar.",
      "Padişah beyaz bir güvercin satın aldırıyor. Sarayın fırınlarından birini de yaktırıyor. Periler gelip Hüsnü Yusuf’u istiyor, üstelik de padişahın üstünü başını parçalıyorlar. Bunun üzerine Padişah elindeki beyaz güvercini havaya kaldırıyor ve:",
      "“Hüsnü Yusuf’un yokluğuna yıllarca katlandım, bundan böyle de katlanırım ama sizin yanınıza da bırakmam artık onu,” diyor. Sonra elindeki güvercini yanmakta olan fırının içine fırlatıyor. Fırlatılanın Hüsnü Yusuf olduğunu zanneden kırk perinin kırkı da fırına dalar ve hepsi de yanarlar. Böylece kötülük perilerinin elinden kurtulan iki gencin düğünü yeniden yapılır; yenilir, içilir, muratlarına geçilir."

    "summary": "Evlenmek için er arayan Kara Böcü'nün (Dürümcekli Kadın) tilki ve horozu beğenmeyip Sıçan Süleyman Bey ile evlenmesi ve dere kenarındaki ibretlik çekişmelerini anlatan eğlenceli masal.",
    "source": "Türk Folklor Araştırmaları Dergisi, 1975, sayı: 310",
    "paragraphs": [
      "Bir varmış, bir yokmuş. Evvel zaman içinde, kalbur saman içinde, bir Kara Böcü (böcek) varmış. Bu böcü, aklına nerden esmişse esmiş, evlenmeye karar vermiş ve er aramaya çıkmış. Uzun süre gezmiş, dolaşmış, nihayet karşısına bir tilki çıkmış. Kara Böcü’nün yanına varmış ve sormuş:",
      "“Merhaba Kara Böcü. Nereye gidiyorsun böyle kendi başına?”",
      "Bizim Kara Böcü’nün buna fena halde canı sıkılmış ve tilkiyi paylamış:",
      "“Halt etmişsin sen, ne diye Kara Böcü oluyum? Dürümcekli dürcen kadın, bürümcekli bürcen kadın, nere giden hay can kadın, desene,” demiş.",
      "“Pekâlâ,” demiş tilki ve sorusunu yeni baştan sormuş:",
      "“Dürümcekli dürcen kadın, bürümcekli bürcen kadın, nere giden hay can kadın?”",
      "Kara Böcü cevap vermiş:",
      "“Er aramaya.”",
      "“Bana varır mısın?”",
      "“Sana varsam sen beni neyle döversin?”",
      "“Tekmeyle, tekmeyle canını çıkartırım.”",
      "“Haydi, öyleyse ben sana varmam,” demiş bizim dürümcekli dürcen kadın ve tekrar yollara düşmüş. Az sonra da karşısına parlak tüyleriyle pek güzel bir horoz çıkmış:",
      "“Nere gidiyorsun kara böcü?”",
      "“Halt etmişsin, ne diye Kara Böcü oluyum? Dürümcekli dürcen kadın, bürümcekli bürcen kadın, nere giden hay can kadın desen olmaz mı?”",
      "“Pekâlâ. Dürümcekli dürcen kadın, bürümcekli bürcen kadın, nere giden hay can kadın?”",
      "“Er aramaya.”",
      "“Bana varır mısın?”",
      "Kara Böcü yine aynı suali sormuş:",
      "“Sana varsam sen beni ne ile döversin?”",
      "“Dıktığımınan dıktığımınan (gagam ile) gözlerini oyarım.”",
      "Bunun üzerine dürümcekli dürcen kadın yine:",
      "“Haydi oradan, ben sana da varmam,” demiş ve yoluna devam etmiş. Bir süre sonra karşısına bu sefer de bir fare çıkmış:",
      "“Nere giden Kara Böcü?”",
      "“Halt etmişsin, ne diye Kara Böcü oluyum? Dürümcekli dürcen kadın, bürümcekli bürcen kadın, nere giden hay can kadın desene.”",
      "“Dürümcekli dürcen kadın, bürümcekli bürcen kadın, nere giden hey can kadın?”",
      "“Er aramaya.”",
      "“Bana varır mısın?”",
      "“Sana varırsam sen beni neyle döversin?”",
      "Fare cevap vermiş:",
      "“Kuyruğumunan kuyruğumunan gözüne sürme çekerim.”",
      "Dürümcekli dürcen kadın buna pek sevinmiş:",
      "“Öyleyse, ben de sana varırım,” demiş.",
      "İkisi de memnun bir şekilde, ileride akıp gitmekte olan derenin kenarına oturmuşlar. Bu sırada canı sıkılan Sıçan Süleyman Bey:",
      "“Şurada bir bey konağı var. Ben oradan biraz şeker çalıp getireyim de beraber yiyelim,” demiş. Dürümcekli dürcen kadın da bunu kabul etmiş ve sıçan Süleyman Bey, şeker çalmak üzere Bey konağına doğru yola çıkmış.",
