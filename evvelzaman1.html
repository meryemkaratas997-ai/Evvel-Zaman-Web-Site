const STORAGE_KEY="turkMasallariUygulama_v2";
const defaultData={statuses:{},quotes:[],reviews:[],likes:{},username:"Masalcı",avatar:"🧚",fontSize:18,theme:"light"};
function loadData(){try{return {...defaultData,...JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}}catch(e){return {...defaultData}}}
let data=loadData(), selectedTaleId=1, selectedCategory="Tümü", searchQuery="", selectedRating=0, currentProfileTab="reading", savedSelection="";
const $=id=>document.getElementById(id);
const talesListEl=$("tales-list"), countInfoEl=$("count-info"), searchInput=$("search-input"), categoryFilters=$("category-filters");
const viewCategory=$("view-category"),viewTitle=$("view-title"),viewTime=$("view-time"),viewMotif=$("view-theme-motif"),viewText=$("view-text"),viewSource=$("view-source"),readerView=$("reader-view");
const modalRoot=$("modal-root"),toastRoot=$("toast-root");
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(message){toastRoot.innerHTML=`<div class="toast">${escapeHTML(message)}</div>`;setTimeout(()=>toastRoot.innerHTML="",2400);}
function getTale(id){return TALES.find(t=>t.id===Number(id));}
function getStatus(id){return data.statuses[id]?.status||"";}
function statusLabel(status){return {"read":"Okudum","reading":"Okuyorum","later":"Daha Sonra Oku"}[status]||"Durum seçilmedi";}
function filterTales(){const q=searchQuery.toLocaleLowerCase("tr-TR").trim();const filtered=TALES.filter(t=>(selectedCategory==="Tümü"||t.category===selectedCategory)&&[t.title,t.summary,t.motif,t.paragraphs.join(" ")].some(v=>v.toLocaleLowerCase("tr-TR").includes(q)));renderList(filtered);}
function renderList(filtered){talesListEl.innerHTML="";countInfoEl.textContent=`${filtered.length} Masal Listeleniyor`;if(!filtered.length){talesListEl.innerHTML='<div class="no-results">Aramanıza veya seçtiğiniz kategoriye uygun masal bulunamadı.</div>';return;}filtered.forEach(tale=>{const card=document.createElement("button");card.type="button";card.className=`tale-card ${tale.id===selectedTaleId?"active":""}`;card.innerHTML=`<div class="card-meta"><span class="card-tag">${escapeHTML(tale.category)}</span><span class="card-number">#${tale.id}</span></div><h3 class="card-title">${escapeHTML(tale.title)}</h3><p class="card-desc">${escapeHTML(tale.summary)}</p>${getStatus(tale.id)?`<div class="card-status">✓ ${statusLabel(getStatus(tale.id))}</div>`:""}`;card.addEventListener("click",()=>selectTale(tale.id));talesListEl.appendChild(card);});}
function renderStatusControls(){const current=getStatus(selectedTaleId);$("reader-status-controls").innerHTML=[["read","✓ Okudum"],["reading","◷ Okuyorum"],["later","＋ Daha Sonra Oku"]].map(([key,label])=>`<button type="button" class="status-btn ${current===key?"active":""}" data-status="${key}">${label}</button>`).join("");$("reader-status-note").textContent=current==="read"&&data.statuses[selectedTaleId]?.date?`Okunma tarihi: ${new Date(data.statuses[selectedTaleId].date).toLocaleDateString("tr-TR")}`:current==="reading"&&data.statuses[selectedTaleId]?.progress?`Kaldığın yer: ${data.statuses[selectedTaleId].progress}`:current?`Durum: ${statusLabel(current)}`:"Bu masal için bir okuma durumu seçebilirsin.";}
function selectTale(id){selectedTaleId=Number(id);const tale=getTale(id);if(!tale)return;viewCategory.textContent=tale.category;viewTitle.textContent=tale.title;viewTime.textContent=`Tahmini Okuma: ~${tale.readingTime}`;viewMotif.textContent=`Motif: ${tale.motif}`;viewSource.textContent=tale.source;viewText.innerHTML=tale.paragraphs.map(p=>`<p>${escapeHTML(p)}</p>`).join("");viewText.style.fontSize=`${data.fontSize||18}px`;renderStatusControls();renderList(TALES.filter(t=>(selectedCategory==="Tümü"||t.category===selectedCategory)&&[t.title,t.summary,t.motif,t.paragraphs.join(" ")].some(v=>v.toLocaleLowerCase("tr-TR").includes(searchQuery.toLocaleLowerCase("tr-TR").trim()))));renderQuotes();renderReviews();selectedRating=0;renderRatingStars();if(window.innerWidth<=900)readerView.scrollIntoView({behavior:"smooth",block:"start"});}
function setStatus(status){if(status==="reading"){const old=data.statuses[selectedTaleId]?.progress||"";openModal("Okuma durumunu güncelle",`<p class="muted">Bu masalda kaldığın yeri yazabilirsin. Örneğin: “3. sayfada / Tembel Ahmet bezirganlarla giderken kaldım.”</p><label for="progress-input" class="muted">Kaldığım yer</label><input class="form-control" id="progress-input" maxlength="120" value="${escapeHTML(old)}" placeholder="Kaldığın yeri yaz..."><div class="modal-actions"><button class="small-btn" data-close-modal>Vazgeç</button><button class="primary-btn" id="save-progress">Kaydet</button></div>`);$("save-progress").onclick=()=>{const progress=$("progress-input").value.trim();data.statuses[selectedTaleId]={...(data.statuses[selectedTaleId]||{}),status:"reading",progress};saveData();closeModal();refreshAll();toast("Okuma durumun kaydedildi.");};return;}if(status==="read"){data.statuses[selectedTaleId]={...(data.statuses[selectedTaleId]||{}),status:"read",date:new Date().toISOString()};}else{data.statuses[selectedTaleId]={...(data.statuses[selectedTaleId]||{}),status:"later"};}saveData();refreshAll();toast("Okuma durumun güncellendi.");}
function openModal(title,body){modalRoot.innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><h2>${escapeHTML(title)}</h2>${body}</section></div>`;modalRoot.querySelectorAll("[data-close-modal]").forEach(b=>b.addEventListener("click",closeModal));modalRoot.querySelector(".modal-backdrop").addEventListener("click",e=>{if(e.target.classList.contains("modal-backdrop"))closeModal();});}
function closeModal(){modalRoot.innerHTML="";}
function renderQuotes(){const quotes=data.quotes.filter(q=>q.taleId===selectedTaleId);$("tale-quotes").innerHTML=quotes.length?quotes.slice().reverse().map(q=>`<div class="quote-item"><p class="quote-text">“${escapeHTML(q.text)}”</p>${q.note?`<p style="margin-top:8px">${escapeHTML(q.note)}</p>`:""}<div class="item-meta">${escapeHTML(q.username||data.username)} · ${new Date(q.date).toLocaleDateString("tr-TR")}</div></div>`).join(""):'<div class="empty-state">Bu masal için henüz alıntı kaydedilmedi. Metinden bir cümle seçerek ilk alıntını oluşturabilirsin.</div>';}
function renderRatingStars(){const reviews=data.reviews.filter(r=>r.taleId===selectedTaleId);$("rating-stars").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="star-btn ${n<=selectedRating?"selected":""}" data-rating="${n}" aria-label="${n} yıldız">★</button>`).join("");const avg=reviews.length?reviews.reduce((sum,r)=>sum+r.rating,0)/reviews.length:0;$("rating-average").textContent=reviews.length?`Ortalama ${avg.toFixed(1)}/5 · ${reviews.length} inceleme`:"Henüz puan verilmedi";}
function renderReviews(){const reviews=data.reviews.filter(r=>r.taleId===selectedTaleId);renderRatingStars();$("tale-reviews").innerHTML=reviews.length?reviews.slice().reverse().map(r=>`<article class="review-item"><div class="rating-row"><strong>${escapeHTML(r.username||data.username)}</strong><span style="color:#d49a25">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p style="margin-top:8px;line-height:1.6">${escapeHTML(r.text)}</p><div class="item-meta">${new Date(r.date).toLocaleDateString("tr-TR")}</div><button type="button" class="like-btn" data-like="${r.id}">♡ Beğen (${data.likes[r.id]||0})</button></article>`).join(""):'<div class="empty-state">Henüz inceleme yok. İlk düşünceni sen paylaşabilirsin.</div>';}
function refreshAll(){filterTales();renderStatusControls();renderQuotes();renderReviews();renderProfileStats();if(!$("profile-panel").classList.contains("hidden"))renderProfileTab();}
function renderProfileStats(){const readCount=TALES.filter(t=>getStatus(t.id)==="read").length;$("stat-read").textContent=`${readCount}/${TALES.length}`;$("stat-rate").textContent=`%${Math.round(readCount/TALES.length*100)}`;$("stat-quotes").textContent=data.quotes.length;$("stat-reviews").textContent=data.reviews.length;$("profile-avatar-display").textContent=data.avatar||"🧚";$("username-input").value=data.username||"Masalcı";$("avatar-select").value=data.avatar||"🧚";document.querySelector(".profile-heading h2").textContent=`${data.username||"Masalcı"}'nın Profili`;}
function renderProfileTab(){const host=$("profile-tab-content");if(currentProfileTab==="reading"){const entries=TALES.filter(t=>getStatus(t.id));host.innerHTML=entries.length?entries.map(t=>`<div class="saved-item"><strong>${escapeHTML(t.title)}</strong><p class="muted">${statusLabel(getStatus(t.id))}${data.statuses[t.id]?.date&&getStatus(t.id)==="read"?" · "+new Date(data.statuses[t.id].date).toLocaleDateString("tr-TR"):""}${data.statuses[t.id]?.progress?" · Kaldığın yer: "+escapeHTML(data.statuses[t.id].progress):""}</p><button class="small-btn" data-open-tale="${t.id}">Masalı aç</button></div>`).join(""):'<div class="empty-state">Henüz okuma listene masal eklemedin. Masal kartlarından bir durum seçebilirsin.</div>';}else if(currentProfileTab==="quotes"){host.innerHTML=data.quotes.length?data.quotes.slice().reverse().map(q=>`<div class="saved-item"><strong>${escapeHTML(getTale(q.taleId)?.title||"Masal")}</strong><p class="quote-text">“${escapeHTML(q.text)}”</p>${q.note?`<p>${escapeHTML(q.note)}</p>`:""}<div class="item-meta">${new Date(q.date).toLocaleDateString("tr-TR")}</div><button class="small-btn" data-open-tale="${q.taleId}">Masala git</button></div>`).join(""):'<div class="empty-state">Henüz alıntı kaydetmedin.</div>';}else{host.innerHTML=data.reviews.length?data.reviews.slice().reverse().map(r=>`<div class="saved-item"><strong>${escapeHTML(getTale(r.taleId)?.title||"Masal")}</strong><p style="color:#d49a25">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</p><p>${escapeHTML(r.text)}</p><div class="item-meta">${new Date(r.date).toLocaleDateString("tr-TR")}</div><button class="small-btn" data-open-tale="${r.taleId}">Masala git</button></div>`).join(""):'<div class="empty-state">Henüz inceleme yazmadın.</div>';}}
function showProfile(){ $("reader-view").classList.add("hidden");document.querySelector(".catalog-area").classList.add("hidden");$("profile-panel").classList.remove("hidden");renderProfileStats();renderProfileTab();window.scrollTo({top:0,behavior:"smooth"});}
function showReader(){ $("profile-panel").classList.add("hidden");$("reader-view").classList.remove("hidden");document.querySelector(".catalog-area").classList.remove("hidden");}
function saveQuote(text){openModal("Alıntını kaydet",`<p class="muted">Seçtiğin cümle aşağıda yer alıyor. İstersen kendi notunu ekleyebilirsin.</p><blockquote class="quote-item quote-text" id="quote-preview">${escapeHTML(text)}</blockquote><label class="muted" for="quote-note">Kişisel notun (isteğe bağlı)</label><textarea id="quote-note" class="form-control" maxlength="300" placeholder="Bu cümle sana ne düşündürdü?"></textarea><div class="modal-actions"><button type="button" class="small-btn" data-close-modal>Vazgeç</button><button type="button" class="primary-btn" id="save-quote">Alıntıyı Kaydet</button></div>`);$("save-quote").onclick=()=>{const note=$("quote-note").value.trim();data.quotes.push({id:Date.now(),taleId:selectedTaleId,text:text.trim(),note,username:data.username,date:new Date().toISOString()});saveData();closeModal();renderQuotes();renderProfileStats();if(currentProfileTab==="quotes")renderProfileTab();toast("Alıntın kaydedildi.");};}
function hideQuoteButton(){const old=document.querySelector(".selection-quote-btn");if(old)old.remove();}
viewText.addEventListener("mouseup",()=>{setTimeout(()=>{const selection=window.getSelection();const text=selection?selection.toString().trim():"";hideQuoteButton();if(!text||!viewText.contains(selection.anchorNode)||text.length>600)return;const range=selection.getRangeAt(0);const rect=range.getBoundingClientRect();const btn=document.createElement("button");btn.className="selection-quote-btn";btn.textContent="Alıntıla";btn.style.left=`${Math.max(8,Math.min(window.scrollX+rect.left,window.scrollX+window.innerWidth-100))}px`;btn.style.top=`${window.scrollY+rect.top-42}px`;btn.addEventListener("mousedown",e=>e.preventDefault());btn.addEventListener("click",()=>{savedSelection=text;hideQuoteButton();saveQuote(savedSelection);});document.body.appendChild(btn);},10);});
document.addEventListener("mousedown",e=>{if(!e.target.closest(".selection-quote-btn"))hideQuoteButton();});
searchInput.addEventListener("input",e=>{searchQuery=e.target.value;filterTales();});
categoryFilters.addEventListener("click",e=>{const button=e.target.closest(".btn-chip");if(!button)return;document.querySelectorAll(".btn-chip").forEach(b=>b.classList.toggle("active",b===button));selectedCategory=button.dataset.category;filterTales();});
$("reader-status-controls").addEventListener("click",e=>{const button=e.target.closest("[data-status]");if(button)setStatus(button.dataset.status);});
$("rating-stars").addEventListener("click",e=>{const b=e.target.closest("[data-rating]");if(b){selectedRating=Number(b.dataset.rating);renderRatingStars();}});
$("review-form").addEventListener("submit",e=>{e.preventDefault();const text=$("review-text").value.trim();if(!text){toast("Lütfen inceleme metnini yaz.");return;}if(!selectedRating){toast("Lütfen önce 1–5 yıldız arasında puan ver.");return;}data.reviews.push({id:String(Date.now())+Math.random().toString(16).slice(2,6),taleId:selectedTaleId,rating:selectedRating,text,username:data.username,date:new Date().toISOString()});saveData();$("review-text").value="";selectedRating=0;renderReviews();renderProfileStats();if(currentProfileTab==="reviews")renderProfileTab();toast("İncelemen kaydedildi.");});
$("tale-reviews").addEventListener("click",e=>{const b=e.target.closest("[data-like]");if(!b)return;const id=b.dataset.like;data.likes[id]=(data.likes[id]||0)+1;saveData();renderReviews();});
$("btn-profile").addEventListener("click",showProfile);$("btn-back-reader").addEventListener("click",showReader);
$("profile-tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;currentProfileTab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));renderProfileTab();});
$("profile-tab-content").addEventListener("click",e=>{const b=e.target.closest("[data-open-tale]");if(!b)return;showReader();selectTale(Number(b.dataset.openTale));});
$("save-profile").addEventListener("click",()=>{const name=$("username-input").value.trim();data.username=name||"Masalcı";data.avatar=$("avatar-select").value;saveData();renderProfileStats();renderProfileTab();toast("Profilin kaydedildi.");});
$("btn-increase").addEventListener("click",()=>{if(data.fontSize<26){data.fontSize+=2;viewText.style.fontSize=data.fontSize+"px";saveData();}});
$("btn-decrease").addEventListener("click",()=>{if(data.fontSize>14){data.fontSize-=2;viewText.style.fontSize=data.fontSize+"px";saveData();}});
function applyTheme(){if(data.theme==="dark"){document.documentElement.setAttribute("data-theme","dark");$("theme-label").textContent="Gündüz Modu";}else{document.documentElement.removeAttribute("data-theme");$("theme-label").textContent="Gece Modu";}}
$("btn-theme").addEventListener("click",()=>{data.theme=data.theme==="dark"?"light":"dark";applyTheme();saveData();});
applyTheme();filterTales();selectTale(1);renderProfileStats();
</script>
</body>
</html>
